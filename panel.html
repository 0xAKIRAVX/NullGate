    </div></div>
    <div class="panel mt"><h3>درباره این نسخه</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px">
        <button class="btn ghost-gold sm" id="chlogBtn">${ico('info')}تغییرات نسخه ۲.۰.۰</button>
      </div>
      <dl class="rows">
        <div><dt>نسخه پنل</dt><dd><span class="ltr">v${esc(S.version || '2.0.1')}</span>${ico('layers')}</dd></div>
        <div><dt>هسته پروکسی</dt><dd><span class="ltr">Xray-core</span>${ico('xray')}</dd></div>
        <div><dt>دامنه سرویس</dt><dd><span class="ltr">${esc(S.host || '—')}</span>${ico('globe')}</dd></div>
      </dl></div>`;
  $('#chlogBtn').onclick = showChangelog;
}

/* ═════════ search ═════════ */
$('#q').addEventListener('input', e => {
  searchTerm = e.target.value.trim().toLowerCase();
  if (tab === 'clients') viewClients();
  else if (searchTerm) go('clients');
});

/* ═════════ boot ═════════ */
buildNav();
api('state').then(d => { S = d; setMe(); $('#login').hidden = true; $('#app').hidden = false; go(tab); }).catch(() => { showLogin(); });
</script>
<script>
/* ═════════ v2.0.0 helpers: bulk / modal / QR / JSON / log / donut / changelog ═════════ */
var sel = new Set();   // selected user ids for bulk actions

function openModal(title, bodyHtml, footHtml) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  $('#modalFoot').innerHTML = footHtml || '';
  const m = $('#modal');
  if (!m.open) m.showModal();
  $('#modalX').onclick = () => m.close();
  return m;
}

function updateBulkbar() {
  const bar = $('#bulkbar'); if (!bar) return;
  bar.classList.toggle('on', sel.size > 0);
  $('#bulkCount').textContent = new Intl.NumberFormat('fa-IR').format(sel.size) + ' کاربر انتخاب شده';
  bar.querySelectorAll('[data-bulk]').forEach(b => { if (b.dataset.bulk !== 'clear') b.disabled = !sel.size; });
}

async function doBulk(action) {
  if (!sel.size) return toast('اول کاربرها را با چک‌باکس انتخاب کنید');
  if (action === 'clear') { sel.clear(); updateBulkbar(); $$('#view [data-sel]').forEach(cb => cb.checked = false); return; }
  if (action === 'delete' && !await ask(`${sel.size} کاربر انتخاب‌شده حذف شود؟ کانفیگ‌هایشان از کار می‌افتد.`)) return;
  const days = +($('#bulkDays')?.value || 0);
  if (action === 'extend' && !(days > 0)) return toast('تعداد روز تمدید را وارد کنید', true);
  try {
    const r = await api('clients/bulk', { ids: [...sel], action, days });
    sel.clear(); S = await api('state');
    toast(`${r.affected} کاربر به‌روزرسانی شد`);
    viewClients();
  } catch (er) { toast(er.message, true); }
}

function showQR(title, data) {
  const m = openModal('QR · ' + title, '<div class="qrwrap" id="qrBox"><span class="sub">در حال ساخت…</span></div>',
    `<button class="btn ghost-gold sm" id="qrCopy">${ico('copy')}کپی لینک</button>`);
  fetch('/panel/api/qr?data=' + encodeURIComponent(data), { credentials: 'same-origin' })
    .then(r => { if (!r.ok) throw 0; return r.text(); })
    .then(svg => { $('#qrBox').innerHTML = svg; })
    .catch(() => { $('#qrBox').innerHTML = '<span class="sub">ساخت QR ناموفق بود — لینک را دستی کپی کنید</span>'; });
  $('#qrCopy').onclick = () => copy(data);
  m.dataset.payload = data;
}

async function showJSON(c) {
  openModal('کانفیگ JSON بهینه · ' + c.name,
    '<div class="jsonview" id="jsonBox">در حال دریافت…</div>',
    `<button class="btn ghost-gold sm" id="jsonDl">${ico('arrdown')}دانلود فایل</button><button class="btn ghost-gold sm" id="jsonCopy">${ico('copy')}کپی</button>`);
  try {
    const r = await fetch('/panel/api/client/' + c.id, { credentials: 'same-origin' });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'خطا');
    const txt = await r.text();
    let pretty = txt;
    try { pretty = JSON.stringify(JSON.parse(txt), null, 2); } catch {}
    $('#jsonBox').textContent = pretty;
    $('#jsonDl').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([pretty], { type: 'application/json' }));
      a.download = 'nullgate-' + c.name.replace(/[^\w.-]/g, '') + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
    };
    $('#jsonCopy').onclick = () => copy(pretty);
  } catch (er) { $('#jsonBox').textContent = 'خطا: ' + er.message; }
}

async function showLog() {
  openModal('لاگ زنده Xray (۱۵۰ خط آخر)', '<div class="logview" id="logBox">در حال بارگذاری…</div>',
    `<button class="btn ghost-gold sm" id="logRefresh">${ico('refresh')}به‌روزرسانی</button>`);
  const load = async () => {
    try {
      const d = await api('log');
      $('#logBox').textContent = (d.lines && d.lines.length) ? d.lines.join('\n') : 'لاگی ثبت نشده — Xray بی‌خطا در حال اجراست';
      $('#logBox').scrollTop = $('#logBox').scrollHeight;
    } catch (er) { $('#logBox').textContent = 'خطا: ' + er.message; }
  };
  await load();
  $('#logRefresh').onclick = load;
}

async function dlServerConfig() {
  try {
    const r = await fetch('/panel/api/server-config', { credentials: 'same-origin' });
    if (!r.ok) throw new Error('خطا در دریافت');
    const txt = await r.text();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' }));
    a.download = 'xray-server.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('دانلود شد — شامل کلید خصوصی است؛ محرمانه نگه دارید');
  } catch (er) { toast(er.message || 'خطا', true); }
}

async function dlBackup() {
  try {
    const r = await fetch('/panel/api/backup', { credentials: 'same-origin' });
    if (!r.ok) throw new Error('خطا در دریافت');
    const txt = await r.text();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' }));
    a.download = 'nullgate-backup-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('پشتیبان دانلود شد');
  } catch (er) { toast(er.message || 'خطا', true); }
}

async function doRestore(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j || !j.state) return toast('فایل پشتیبان نامعتبر است', true);
    const n = (j.state.clients || []).length;
    if (!await ask(`بازیابی ${n} کاربر و ${(j.state.inbounds || []).length} اینباند؟ تنظیمات فعلی جایگزین می‌شود.`)) return;
    const r = await api('restore', j);
    S = await api('state');
    toast(`بازیابی شد: ${r.clients} کاربر، ${r.inbounds} اینباند`);
    viewSettings();
  } catch (er) { toast('بازیابی ناموفق: ' + (er.message || 'فایل نامعتبر'), true); }
}

function donut(parts) {
  const total = parts.reduce((a, p) => a + p.value, 0);
  if (!total) return `<svg viewBox="0 0 140 140" width="170" height="170"><circle r="54" cx="70" cy="70" fill="none" stroke="var(--line2)" stroke-width="22"/></svg>`;
  const C = 2 * Math.PI * 54;
  let acc = 0, segs = '';
  for (const p of parts) {
    const frac = p.value / total;
    segs += `<circle r="54" cx="70" cy="70" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${(frac * C).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-acc * C).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
    acc += frac;
  }
  return `<svg viewBox="0 0 140 140" width="170" height="170">${segs}<text x="70" y="67" text-anchor="middle" class="donut-t">${size(total)}</text><text x="70" y="84" text-anchor="middle" class="donut-s">کل مصرف کاربران</text></svg>`;
}

function showChangelog() {
  openModal('تغییرات نسخه ۲.۰.۱', `<ul class="chlog"><li><b>پرچم اصیل شیر و خورشید در کل پنل</b> — پس‌زمینه صفحه ورود و بنر داشبورد با پرچم شیر و خورشید بازسازی شد</li><li><b>لوگوی اصلاح‌شده</b> — شمشیر اکنون در دست شیر است (مطابق نشان اصیل شیر و خورشید)</li><li><b>رفع باگ‌ها</b> — اصلاح نمایش گزارشات و بهبود پایداری</li></ul><hr style="border-color:var(--line);margin:10px 0"><ul class="chlog">
    <li><b>لوگوی جدید شیر و خورشید</b> — هویت کامل تازه در ورود، سایدبار، نوار بالا و فاوآیکون</li>
    <li><b>QR کد</b> برای لینک ساب و هر کانفیگ تکی — اسکن مستقیم روی گوشی</li>
    <li><b>کانفیگ JSON بهینه</b> برای هر کاربر — مسدودسازی تبلیغات، عبور مستقیم سایت‌های ایرانی، DNS امن، mux بهینه</li>
    <li><b>پروتکل‌های قابل خاموش/روشن</b> — سراسری و برای هر کاربر جداگانه</li>
    <li><b>پشتیبان‌گیری و بازیابی کامل</b> با یک فایل JSON</li>
    <li><b>عملیات گروهی</b> — تمدید، صفر کردن مصرف و حذف چند کاربر یکجا</li>
    <li><b>لاگ زنده Xray + بررسی سلامت سرویس</b> + دانلود پیکربندی سرور</li>
    <li><b>کانفیگ‌های بهینه‌تر</b> — early-data (ed=2048) روی WebSocket ها، spiderX برای Reality، تنظیمات policy و sockopt سریع‌تر</li>
    <li><b>مدیریت بهتر کاربران</b> — تغییر نام، یادداشت مدیر، بازتولید UUID، گزارش دونات مصرف</li>
    <li><b>تنظیمات بیشتر</b> — مدت نشست ورود، هشدار انقضای نزدیک در داشبورد</li>
  </ul>`);
}
</script>
</body>
</html>
