<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<meta name="robots" content="noindex,nofollow">
<title>NullGate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f1a;--bg2:#0f1524;--card:#141b2d;--card2:#1a2338;--line:#232e4a;--line2:#1b2440;--field:#0d1322;
  --gold:#e0b64f;--gold2:#f3d27a;--gold-d:#8a6a1c;--gtx:#221803;
  --green:#2ecc71;--red:#ef5350;--blue:#4f8ef7;--purple:#8b5cf6;--cyan:#22d3ee;--orange:#f0a020;
  --tx:#e9edf7;--mu:#93a0bd;
  --sans:'Vazirmatn',Tahoma,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --goldg:linear-gradient(135deg,#f3d27a,#d9a92f);
}
html[data-accent="neon"]{--gold:#00ff66;--gold2:#7cff3f;--goldg:linear-gradient(135deg,#7cff3f,#00c853);--gtx:#02150a;--gold-d:#0c9c46}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;background:radial-gradient(1100px 480px at 85% -10%,rgba(224,182,79,.07),transparent 60%),var(--bg);color:var(--tx);font:14.5px/1.7 var(--sans)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ltr{direction:ltr;unicode-bidi:isolate}
.mu{color:var(--mu)}
::selection{background:rgba(224,182,79,.35)}
/* ── buttons / inputs / pills ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--line);color:var(--tx);font-weight:600;transition:.15s}
.btn:hover{background:var(--card2)}
.btn.gold{background:var(--goldg);border:0;color:var(--gtx);font-weight:800;box-shadow:0 6px 20px -6px rgba(217,169,47,.45)}
.btn.gold:hover{filter:brightness(1.08)}
.btn.red{border-color:#5f2120;color:var(--red)}
.btn.red:hover{background:rgba(239,83,80,.1)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.icon{width:38px;min-height:38px;padding:0;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--mu);font-weight:600}
.field small{color:var(--mu);font-size:12px;line-height:1.8}
.in{width:100%;min-height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--field);transition:border-color .15s}
.in:focus{outline:none;border-color:var(--gold)}
.in.ltr{direction:ltr;text-align:left;font-family:var(--mono);font-size:13px}
select.in option{background:var(--field)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--mu);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--mu)}
.pill.ok{color:#7ee2a8;border-color:rgba(46,204,113,.4);background:rgba(46,204,113,.08)}
.pill.ok i{background:var(--green);box-shadow:0 0 8px var(--green)}
.pill.no{color:#ff9d9d;border-color:rgba(239,83,80,.4);background:rgba(239,83,80,.08)}
.pill.no i{background:var(--red)}
.pill.gd{color:var(--gold2);border-color:rgba(224,182,79,.4);background:rgba(224,182,79,.07)}
/* ── login ── */
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.art{position:relative;overflow:hidden;background:linear-gradient(180deg,#060a14 0%,#101a33 45%,#4a3714 80%,#8a6a1c 100%)}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.lside{display:flex;align-items:center;justify-content:center;padding:28px 20px;background:radial-gradient(circle at 70% 0%,#152036 0%,var(--bg) 55%)}
.login-box{width:100%;max-width:392px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 30px 28px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.login-box .emb{display:block;width:92px;height:92px;margin:0 auto 8px;filter:drop-shadow(0 6px 18px rgba(217,169,47,.35))}
.login-box h1{margin:0 0 4px;font-size:22px;font-weight:900;text-align:center;color:var(--gold2)}
.login-box>p{margin:0 0 22px;text-align:center;color:var(--mu);font-size:13px}
.iwrap{position:relative}
.iwrap>.i{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--mu);width:19px;height:19px;pointer-events:none}
.iwrap .in{padding-inline-start:42px}
.iwrap .eye{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--mu);border-radius:8px}
.err{min-height:22px;color:var(--red);font-size:13px;margin:4px 0 6px}
.remember{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px;margin:2px 0 14px;cursor:pointer}
.remember input{accent-color:var(--gold);width:16px;height:16px}
@media(max-width:900px){.login{grid-template-columns:1fr;grid-template-rows:170px 1fr}.art{min-height:0}}
/* ── shell ── */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.content{min-width:0}
.rail{background:var(--bg2);display:flex;flex-direction:column;gap:4px;padding:18px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 18px;font-weight:900;font-size:17px}
.brand .emb{width:42px;height:42px}
.brand small{display:block;font-size:11px;color:var(--mu);font-weight:500}
.nav{display:flex;align-items:center;gap:12px;padding:0 13px;min-height:46px;border-radius:11px;color:var(--mu);font-weight:600;text-align:start;transition:.15s}
.nav:hover{background:var(--card2);color:var(--tx)}
.nav[aria-current=page]{background:linear-gradient(90deg,rgba(224,182,79,.16),rgba(224,182,79,.04));color:var(--gold2);box-shadow:inset -3px 0 0 var(--gold)}
.grow{flex:1}
.ruser{display:flex;align-items:center;gap:10px;padding:12px 6px 2px;border-top:1px solid var(--line2)}
.ruser b{display:block;font-size:13.5px}
.ruser small{color:var(--mu);font-size:11.5px}
.ruser .nav{min-height:38px;padding:0 10px;color:#e58a8a}
.ruser .nav:hover{background:rgba(239,83,80,.1);color:var(--red)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:11px 22px;background:rgba(11,15,26,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
#burger{display:none;width:40px;height:40px;border-radius:10px;color:var(--mu)}
#burger:hover{background:var(--card2);color:var(--tx)}
.tb-brand{display:none;align-items:center;gap:9px;font-weight:900;font-size:15px}
.tb-brand .emb{width:30px;height:30px}
.qwrap{position:relative;flex:1;max-width:430px;margin:0 auto}
.qwrap>.i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--mu);width:17px;height:17px}
#q{width:100%;min-height:40px;padding:0 38px;border-radius:11px;border:1px solid var(--line);background:var(--field)}
#q:focus{outline:none;border-color:var(--gold)}
.acts{display:flex;align-items:center;gap:8px}
.iconb{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mu)}
.iconb:hover{background:var(--card2);color:var(--tx)}
.tb-user{display:flex;align-items:center;gap:9px}
.tb-user small{display:block;color:var(--mu);font-size:11px;line-height:1.3;text-align:end}
.tb-user b{font-size:13px;line-height:1.3}
main{padding:20px 22px 60px;max-width:1180px;width:100%;margin:0 auto}
.pt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px;flex-wrap:wrap}
.pt h2{margin:0;font-size:21px;font-weight:900}
.pt h2::after{content:'';display:block;width:44px;height:3px;border-radius:3px;background:var(--goldg);margin-top:6px}
#backdrop{position:fixed;inset:0;background:rgba(4,7,14,.6);z-index:39;opacity:0;pointer-events:none;transition:.2s}
#backdrop.show{opacity:1;pointer-events:auto}
@media(max-width:999px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;top:0;bottom:0;right:0;width:min(80vw,290px);z-index:40;transform:translateX(105%);transition:transform .25s;box-shadow:-20px 0 60px rgba(0,0,0,.5);border-inline-start:1px solid var(--line2)}
  .rail.open{transform:none}
  #burger{display:flex}.tb-brand{display:flex}
  .topbar{padding:11px 14px}main{padding:16px 14px 50px}
}
@media(min-width:1000px){.app{grid-template-columns:264px 1fr}.rail{position:sticky;top:0;height:100vh;border-inline-end:1px solid var(--line2)}#backdrop{display:none}}
@media(max-width:560px){.qwrap{display:none}}
@media(max-width:640px){.tb-user div{display:none}}
/* ── panels / cards ── */
.panel{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:18px}
.mt{margin-top:14px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.phead h3,.panel>h3{margin:0;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:9px}
.phead h3::before,.panel>h3::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--goldg);transform:rotate(45deg);flex-shrink:0}
.sub{margin:0 0 14px;color:var(--mu);font-size:12.5px}
.cards{display:grid;gap:13px;grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.cards{grid-template-columns:1fr}}
.grid2{display:grid;gap:14px;grid-template-columns:1.5fr 1fr}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.stat{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px}
.sic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sic .i{width:22px;height:22px}
.sic.blue{background:rgba(79,142,247,.14);color:var(--blue)}
.sic.green{background:rgba(46,204,113,.13);color:var(--green)}
.sic.purple{background:rgba(139,92,246,.14);color:var(--purple)}
.sic.gold{background:rgba(224,182,79,.13);color:var(--gold)}
.stat small{display:block;color:var(--mu);font-size:12px}
.stat b{display:block;font-size:19px;font-weight:900;margin:1px 0}
/* ── hero banner ── */
.banner{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line2);background:linear-gradient(100deg,#0a1020 0%,#131f3d 42%,#33301a 75%,#6b4d13 100%);min-height:150px;display:flex;align-items:center;margin-bottom:14px}
.banner .bart{position:absolute;inset:0;width:100%;height:100%}
.btxt{position:relative;z-index:2;padding:22px 28px}
.banner h3{margin:0;font-size:24px;font-weight:900;color:#f6e8c4}
.banner p{margin:6px 0 0;color:#d8c290;font-size:13.5px}
.uline{display:block;width:56px;height:3px;border-radius:3px;background:var(--goldg);margin-top:10px}
/* ── gauges / chart / rows ── */
.gauge{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:14px 16px}
.gauge small{display:block;color:var(--mu);font-size:12px}
.gauge b{display:block;font-size:19px;font-weight:900;margin:2px 0}
.gauge svg{width:62px;height:62px;flex-shrink:0}
.tr2{fill:none;stroke:var(--field);stroke-width:7}
.rg{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .8s cubic-bezier(.2,.7,.2,1)}
.gnet .sp{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;margin-top:3px}
.gnet>.i{width:30px;height:30px;color:var(--blue)}
#chart{width:100%;height:200px;display:block}
.axis{display:flex;justify-content:space-between;color:var(--mu);font-size:11.5px;margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px}
.rows>div{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line2)}
.rows>div:first-child{border-top:0}
.rows dt{color:var(--mu);font-size:13px}
.rows dd{margin:0;font-weight:600;text-align:end;font-size:13.5px;min-width:0}
.bar{height:6px;border-radius:6px;background:var(--field);overflow:hidden;margin-top:6px;width:170px;margin-inline-start:auto}
.bar b{display:block;height:100%;background:var(--goldg);border-radius:6px}
/* ── users ── */
.avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#0d1117;background:var(--ac,var(--gold));flex-shrink:0}
.ucard{background:var(--card);border:1px solid var(--line2);border-radius:15px;margin-bottom:12px;overflow:hidden}
.uhead{display:grid;grid-template-columns:44px 1.15fr .8fr 1.5fr .6fr .95fr 92px;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.uhead:hover{background:var(--card2)}
.uname{min-width:0}
.uname b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uname small{display:block;color:var(--mu);font-size:11px;font-family:var(--mono);direction:ltr;text-align:end}
.uusage{min-width:0}
.ur{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--mu)}
.ur b{color:var(--tx);font-weight:600}
.ubar{height:6px;border-radius:6px;background:var(--field);overflow:hidden;margin-top:5px}
.ubar b{display:block;height:100%;background:var(--green);border-radius:6px}
.ubar.warn b{background:var(--orange)}
.ubar.full b{background:var(--red)}
.uquota{font-weight:700;font-size:13px}
.uexp b{display:block;font-size:12.5px;font-weight:700}
.uexp small{color:var(--mu);font-size:11px}
.uexp.bad b{color:#ff9d9d}.uexp.bad small{color:var(--red)}
.uacts{display:flex;gap:6px;justify-content:flex-end}
.chev{transition:transform .2s;color:var(--mu);display:flex}
.ucard.open .chev{transform:rotate(180deg)}
.cbody{display:none;padding:4px 18px 18px;border-top:1px dashed var(--line2)}
.ucard.open .cbody{display:block}
.cbody h4{margin:16px 0 8px;font-size:13px;font-weight:800;color:var(--gold2)}
.urlrow{display:flex;gap:8px;margin-bottom:8px}
.urlrow .u{flex:1;min-width:0;height:38px;display:flex;align-items:center;padding:0 11px;border-radius:9px;border:1px solid var(--line2);background:var(--field);font-family:var(--mono);font-size:12px;direction:ltr;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#9fd8ae}
.urlrow.sub .u{border-color:rgba(224,182,79,.35);color:#e8cf9a}
.cfg{margin-bottom:10px}
.cfg small{display:block;margin-bottom:4px;font-size:12px;color:var(--mu)}
.ed{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ed .in{flex:1 1 130px;min-height:38px}
.ed .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);cursor:pointer}
.ed input[type=checkbox]{accent-color:var(--gold)}
.note{display:block;margin-top:6px;color:var(--mu);font-size:11.5px}
.addrow{display:flex;gap:10px;flex-wrap:wrap}
.addrow .in{flex:1 1 150px}
.addrow .in.num{flex:0 1 110px}
.help{margin:12px 0;color:var(--mu);font-size:12.5px;line-height:1.9;background:var(--bg2);border:1px dashed var(--line);border-radius:13px;padding:12px 15px}
.help b{color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:34px 10px}
.rrow{display:grid;grid-template-columns:40px 1fr .8fr 1.2fr .95fr 40px;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line2)}
.rrow:first-child{border-top:0}
.rrow .avatar{width:36px;height:36px;font-size:14px}
.rrow b{font-size:13.5px;display:block}
.rrow .ruse,.rrow .uname{min-width:0}
.rbtn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mu);border:1px solid var(--line)}
.rbtn:hover{color:var(--gold2);border-color:var(--gold-d)}
@media(max-width:900px){
  .uhead{grid-template-columns:44px 1fr 40px;grid-template-areas:"av nm ch" "st st st" "us us us" "qt ex ex" "ac ac ac";row-gap:9px}
  .avatar{grid-area:av}.uname{grid-area:nm}.ustat{grid-area:st}.uusage{grid-area:us}.uquota{grid-area:qt}.uexp{grid-area:ex}.uacts{grid-area:ac}
}
@media(max-width:760px){.rrow{grid-template-columns:40px 1fr 40px}.rrow .ustat,.rrow .ruse,.rrow .rexp{display:none}}
/* ── protocols ── */
.plist>div{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.plist>div:first-child{border-top:0;padding-top:2px}
.plist .pn{flex:1;min-width:0}
.plist b{display:block;font-weight:800}
.plist small{display:block;color:var(--mu);font-size:12.5px}
.plist code,.steps code{font-family:var(--mono);font-size:12px;background:var(--field);border:1px solid var(--line2);border-radius:6px;padding:2px 8px;direction:ltr;unicode-bidi:isolate}
.steps{margin:12px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding-inline-start:38px;margin-bottom:10px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:1px;width:26px;height:26px;border-radius:50%;background:rgba(224,182,79,.12);border:1px solid rgba(224,182,79,.4);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--gold2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
.ibf{margin-top:16px;padding-top:16px;border-top:1px solid var(--line2)}
.ibf small{display:block;margin:-4px 0 12px;color:var(--mu)}
.plist .btn.icon{align-self:center}
/* ── dialog / toast ── */
dialog{border:1px solid var(--gold-d);border-radius:16px;background:var(--card);color:var(--tx);padding:22px;width:min(92vw,360px)}
dialog::backdrop{background:rgba(4,7,14,.72)}
dialog p{margin:0 0 18px}
dialog .acts{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;inset-inline:0;bottom:26px;display:flex;justify-content:center;pointer-events:none;z-index:60}
#toast span{background:var(--goldg);color:var(--gtx);padding:10px 20px;border-radius:999px;font-weight:800;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 10px 30px -8px rgba(0,0,0,.6)}
#toast.show span{opacity:1;transform:none}
#toast.bad span{background:#e5484d;color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="emblem" viewBox="0 0 120 120">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7dc8a"/><stop offset=".55" stop-color="#dcaa3a"/><stop offset="1" stop-color="#96700f"/></linearGradient></defs>
    <g fill="url(#gg)">
      <path id="ray" d="M57.4 15 L60 5.5 L62.6 15 Z"/>

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>r.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const FAD='۰۱۲۳۴۵۶۷۸۹';
const fa=n=>String(n).replace(/\d/g,d=>FAD[d]);
const AVA=['#e0b64f','#4f8ef7','#8b5cf6','#2ecc71','#ef5350','#22d3ee','#f0a020'];
const avaColor=n=>AVA[(n.charCodeAt(0)+n.length)%AVA.length];

const TABS=[['overview','داشبورد','pulse'],['clients','کاربران','users'],['protocols','پروتکل‌ها','layers'],['settings','تنظیمات','sliders']];

/* ───── api ───── */
async function api(path,body){
  const opt=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)};
  const r=await fetch('/panel/api/'+path,{credentials:'same-origin',cache:'no-store',...opt});
  if(r.status===401&&path!=='login'){showLogin();throw new Error('unauthorized');}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'خطا در ارتباط با سرور');
  return d;
}

/* ───── helpers ───── */
let toastT;
function toast(msg,bad){const t=$('#toast');t.className='show'+(bad?' bad':'');t.firstElementChild.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.className='',1800);}
function ask(msg,yes){return new Promise(res=>{const d=$('#dlg');$('#dlgMsg').textContent=msg;$('#dlgYes').textContent=yes||'حذف';const done=v=>{d.close();res(v)};$('#dlgYes').onclick=()=>done(true);$('#dlgNo').onclick=()=>done(false);d.oncancel=()=>res(false);d.showModal();});}
async function copy(text){try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}toast('کپی شد');}
function speed(b){const u=['B/s','KB/s','MB/s','GB/s'];let i=0;while(b>=1024&&i<3){b/=1024;i++;}return[b>=100||i===0?Math.round(b):b.toFixed(1),u[i]];}
function size(b){const u=['B','KB','MB','GB','TB'];let i=0;while(b>=1024&&i<4){b/=1024;i++;}return(i<2?Math.round(b):b.toFixed(1))+' '+u[i];}
function dur(s){const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);if(d)return`${fa(d)} روز و ${fa(h)} ساعت`;if(h)return`${fa(h)} ساعت و ${fa(m)} دقیقه`;return`${fa(m)} دقیقه`;}
function jalali(ts){
  const d=new Date(ts*1000);let gy=d.getFullYear(),gm=d.getMonth()+1,gd=d.getDate();
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;
  const gy2=gm>2?gy+1:gy;
  let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053);days%=12053;
  jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}
  const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+(days<186?days%31:(days-186)%30);
  return `${jy}/${String(jm).padStart(2,'0')}/${String(jd).padStart(2,'0')}`;
}
function ustatus(c){return c.status==='active'?'<span class="pill ok"><i></i>فعال</span>':c.status==='expired'?'<span class="pill no"><i></i>منقضی</span>':'<span class="pill no"><i></i>حجم تمام شد</span>';}
function expCell(c){
  if(!c.expire_at)return'<b>نامحدود</b><small>—</small>';
  const cls=c.status==='active'?'':' class="bad"';
  return`<b${cls}>${fa(jalali(c.expire_at))}</b><small>${c.status==='expired'?'منقضی شده':fa(c.days_left)+' روز دیگر'}</small>`;
}

  $$('#rail .nav[data-tab]').forEach(b=>b.onclick=()=>{go(b.dataset.tab);closeRail();});
  $('#logoutBtn').onclick=async()=>{await api('logout',{}).catch(()=>{});showLogin();};

}
function go(t){
  tab=t;localStorage.setItem('tab',t);
  $$('#rail .nav[data-tab]').forEach(b=>{if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  $('#title').textContent=TABS.find(x=>x[0]===t)[1];
  stopPoll();
  ({overview:viewOverview,clients:viewClients,protocols:viewProtocols,settings:viewSettings})[t]();
  if(t==='clients')api('state').then(x=>{const ae=document.activeElement;if(tab==='clients'&&!(ae&&ae.closest&&ae.closest('form'))){S=x;viewClients();}}).catch(()=>{});
  window.scrollTo(0,0);
}

function drawChart(h){
  const n=h.cpu.length;if(n<2)return;
  const m=Math.max(20480,...h.rx,...h.tx);
  const X=i=>(i/(n-1)*600).toFixed(1),Y=(v,max)=>(168-v/max*150).toFixed(1);
  const line=(a,max)=>a.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v,max)).join(' ');
  const grid=[0,25,50,75,100].map(p=>`<line x1="0" x2="600" y1="${18+p*1.5}" y2="${18+p*1.5}" stroke="#1b2440" stroke-width="1"/><text x="606" y="${21.5+p*1.5}" font-size="10" fill="#55617f">${p}</text>`).join('');
  $('#chart').innerHTML=grid+
    `<path d="${line(h.cpu,100)}" fill="none" stroke="#2ecc71" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`+
    `<path d="${line(h.mem,100)}" fill="none" stroke="#22d3ee" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`+
    `<path d="${line(h.rx,m)}" fill="none" stroke="#8b5cf6" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`+
    `<path d="${line(h.tx,m)}" fill="none" stroke="#e0b64f" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
}

        try{await api('clients/delete',{id:c.id});openRows.delete(c.id);S=await api('state');toast('کاربر حذف شد');viewClients();}

      }
    });
  });
}

    :'<p class="sub" style="margin:0">هنوز اینباند سفارشی نساخته‌اید.</p>';

      <div class="g2">
        <div class="field"><label>پروتکل</label><select class="in" name="protocol"><option value="vless">VLESS</option><option value="vmess">VMess</option><option value="trojan">Trojan</option></select></div>
        <div class="field"><label>امنیت</label><select class="in" name="security"><option value="tls">TLS (پشت دامنه)</option><option value="reality">Reality (پورت مستقیم)</option></select></div>
        <div class="field"><label>ترنسپورت</label><select class="in" name="network"></select></div>
        <div class="field" id="fPort"><label>پورت</label><input class="in ltr" name="port" type="number" min="1024" max="65535" placeholder="مثلاً 9443"></div>
      </div>
      <div class="field" id="fPath"><label id="lPath">مسیر (خالی = خودکار)</label><input class="in ltr" name="path" placeholder="/abc123"></div>
      <div class="field" id="fSni"><label>SNI</label><input class="in ltr" name="sni" placeholder="${esc(S.settings.reality_sni)}"></div>
      <small id="ibHint"></small>
      <button class="btn gold" style="width:100%;margin-top:12px">ساخت اینباند</button>
    </form></div>`;

function wireInboundForm(){
  const f=$('#ibForm');
  const sync=()=>{
    const rea=f.security.value==='reality';
    if(rea)f.protocol.value='vless';
    [...f.protocol.options].forEach(o=>o.disabled=rea&&o.value!=='vless');
    let nets=rea?['tcp','xhttp','grpc']:['ws','xhttp','httpupgrade','grpc'];
    if(!rea&&f.protocol.value==='vmess')nets=nets.filter(n=>n!=='xhttp');
    const cur=f.network.value;
    f.network.innerHTML=nets.map(n=>`<option value="${n}">${NET_L[n]}</option>`).join('');
    f.network.value=nets.includes(cur)?cur:nets[0];
    const net=f.network.value;
    $('#fPort').hidden=$('#fSni').hidden=!rea;
    $('#fPath').hidden=net==='tcp';
    $('#lPath').textContent=net==='grpc'?'Service name (خالی = خودکار)':'مسیر (خالی = خودکار)';
    $('#ibHint').textContent=rea
      ?'Reality روی پورت مستقیم گوش می‌دهد؛ این پورت باید از بیرون باز باشد (VPS یا پورت اضافه در docker-compose). روی Railway فقط یک TCP Proxy هست که Reality پیش‌فرض از آن استفاده می‌کند.'
      :net==='grpc'?'gRPC به HTTP/2 نیاز دارد؛ پشت پروکسی HTTP ریلوی ممکن است وصل نشود و روی VPS با دامنه خودتان مطمئن‌تر است.'
      :'TLS را دامنه یا پلتفرم انجام می‌دهد و مسیر جدا روی همان پورت ۴۴۳ سرو می‌شود.';
  };
  f.security.onchange=f.protocol.onchange=f.network.onchange=sync;sync();
  f.onsubmit=async e=>{
    e.preventDefault();const b=f.querySelector('button:last-of-type');b.disabled=true;
    try{await api('inbounds',Object.fromEntries(new FormData(f)));S=await api('state');toast('اینباند ساخته شد');viewProtocols();}
    catch(er){toast(er.message,true);b.disabled=false;}
  };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!await ask('این اینباند حذف شود؟ لینک‌های آن از همه کاربران پاک می‌شود.'))return;
    try{await api('inbounds/delete',{tag:b.dataset.del});S=await api('state');toast('حذف شد');viewProtocols();}
    catch(er){toast(er.message,true);}
  });
}

    <div class="panel mt"><h3>سرویس</h3><p class="sub">اگر کانفیگی پس از تغییرات وصل نشد، Xray را دوباره راه‌اندازی کنید.</p>
      <button class="btn" id="rst">${ico('refresh')}راه‌اندازی مجدد Xray</button></div>`;
  $('#setForm').onsubmit=async e=>{
    e.preventDefault();const f=e.target;
    try{
      await api('settings',{user:f.user.value,pass:f.pass.value,address:f.address.value,reality_sni:f.reality_sni.value});
      S=await api('state');toast('ذخیره شد');viewSettings();
    }catch(er){toast(er.message,true);}
  };
  $('#rst').onclick=async()=>{
    const b=$('#rst');b.disabled=true;
    try{await api('restart',{});S=await api('state');xrayPill();toast('Xray دوباره راه‌اندازی شد');}catch(er){toast(er.message,true);}
    b.disabled=false;
  };
}

/* ───── boot & events ───── */
 $('#burger').onclick=()=>{$('#rail').classList.toggle('open');$('#backdrop').classList.toggle('show');};
 $('#backdrop').onclick=closeRail;
 $('#eyeBtn').onclick=()=>{const p=$('#passIn');p.type=p.type==='password'?'text':'password';};
if(localStorage.getItem('accent')==='neon')document.documentElement.dataset.accent='neon';
 $('#accBtn').onclick=()=>{const r=document.documentElement,on=r.dataset.accent==='neon';if(on)delete r.dataset.accent;else r.dataset.accent='neon';localStorage.setItem('accent',on?'gold':'neon');toast(on?'تم طلایی فعال شد':'تم نئون فعال شد');};
 $('#q').oninput=e=>{filter=e.target.value.trim();if(tab!=='clients')go('clients');else viewClients();};
if(localStorage.getItem('ngu')){$('#rem').checked=true;$('#loginForm').user.value=localStorage.getItem('ngu');}
 $('#loginForm').onsubmit=async e=>{
  e.preventDefault();const f=e.target;$('#loginErr').textContent='';
  if($('#rem').checked)localStorage.setItem('ngu',f.user.value);else localStorage.removeItem('ngu');
  try{await api('login',{user:f.user.value,pass:f.pass.value});await enter();}
  catch(er){$('#loginErr').textContent=er.message;}
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)stopPoll();else if(S&&tab==='overview'&&!pollTimer){refreshStats();pollTimer=setInterval(refreshStats,2500);}
});
buildNav();
api('state').then(d=>{S=d;$('#login').hidden=true;$('#app').hidden=false;go(tab);}).catch(()=>{});
</script>
</body>
</html>
