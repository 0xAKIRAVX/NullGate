html[data-theme="light"]{
  --bg:#eef1f7; --bg2:#e7ebf3; --card:#ffffff; --card2:#f4f6fb; --line:#dbe2ee; --line2:#e5eaf3;
  --tx:#18203a; --mu:#5d6783; --mu2:#8891a8;
  --gold:#c9992e; --gold-d:#a87f1f; --gold-tx:#9a7715;
  --sh:0 10px 26px -14px rgba(23,32,58,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.75;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ltr{direction:ltr;unicode-bidi:isolate}
::placeholder{color:var(--mu2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════════════ buttons & fields ═══════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-weight:600;transition:filter .15s,background .15s,border-color .15s}
.btn:hover{filter:brightness(1.12)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:transparent;color:#241b03;font-weight:800;box-shadow:0 6px 18px -6px rgba(217,180,74,.45)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost-gold{background:transparent;border-color:var(--gold-d);color:var(--gold-tx);font-weight:700}
.btn.ghost-gold:hover{background:rgba(217,180,74,.1)}
.btn.bad{border-color:#5c2323;color:var(--red);background:transparent}
.btn.bad:hover{background:rgba(248,113,113,.08)}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px;border-radius:9px}
.btn.icon{width:38px;min-height:38px;padding:0;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--mu);font-weight:600}
.field small{color:var(--mu);font-size:12px;line-height:1.8}
input.in,select.in{width:100%;min-height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);transition:border-color .15s}
input.in:focus,select.in:focus{outline:none;border-color:var(--gold)}
input.in.ltr{direction:ltr;text-align:left;font-family:var(--mono);font-size:12.5px}
select.in option{background:var(--bg2)}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mu);cursor:pointer;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--gold)}

/* ═══════════════ login ═══════════════ */
.login{position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(rgba(6,9,18,.42),rgba(6,9,18,.66) 60%,rgba(6,9,18,.82)),var(--loginbg) center/cover no-repeat fixed}
.login-slogan{position:absolute;top:26px;inset-inline-start:30px;line-height:1.5;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.login-slogan .l1{display:block;color:var(--gold-tx);font-size:15px;font-weight:600}
.login-slogan .l2{display:block;color:#fff;font-size:22px;font-weight:900;letter-spacing:.2px}
.login-slogan .l3{display:block;color:#c8d0e2;font-size:12.5px;margin-top:2px}
.login-quote{position:absolute;bottom:26px;inset-inline:0;text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.login-quote b{display:block;color:var(--gold-tx);font-size:18px;font-weight:800}
.login-quote span{display:block;color:#c8d0e2;font-size:12.5px;margin-top:2px}
.login-card{position:relative;width:100%;max-width:378px;background:rgba(13,18,33,.78);border:1px solid rgba(217,180,74,.22);border-radius:18px;padding:30px 26px 24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 70px -20px rgba(0,0,0,.75)}
html[data-theme="light"] .login-card{background:rgba(255,255,255,.88);border-color:rgba(201,153,46,.35)}
.login-card .emb{display:block;width:88px;height:88px;margin:0 auto 10px;background:var(--emblem) center/contain no-repeat;filter:drop-shadow(0 6px 18px rgba(217,180,74,.35))}
.login-card h1{margin:0 0 3px;font-size:20px;font-weight:800;text-align:center;color:#fff}
html[data-theme="light"] .login-card h1{color:var(--tx)}
.login-card>p{margin:0 0 20px;text-align:center;color:#aeb7cc;font-size:12.5px}
html[data-theme="light"] .login-card>p{color:var(--mu)}
.in-wrap{position:relative;margin-bottom:13px}
.in-wrap>.i{position:absolute;top:50%;inset-inline-start:13px;transform:translateY(-50%);width:19px;height:19px;color:var(--mu2);pointer-events:none}
.in-wrap input{padding-inline-start:42px;background:rgba(9,13,25,.6);border-color:#2a3554}
html[data-theme="light"] .in-wrap input{background:var(--bg2)}
.in-wrap input:focus{border-color:var(--gold)}
.eye{position:absolute;top:50%;inset-inline-end:8px;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--mu2);border-radius:8px}
.eye:hover{color:var(--tx)}
.login-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px}
.forgot{font-size:12px;color:#aeb7cc}
.forgot:hover{color:var(--gold-tx)}
html[data-theme="light"] .forgot{color:var(--mu)}
.err{min-height:20px;color:var(--red);font-size:12.5px;margin-bottom:4px}
.login-card .btn.gold{width:100%;min-height:47px;font-size:15.5px;border-radius:12px;margin-top:2px}

/* ═══════════════ app shell ═══════════════ */
.app{display:flex;min-height:100vh}
.rail{width:252px;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:20px 14px 16px;background:var(--bg2);border-inline-end:1px solid var(--line2);z-index:40;transition:width .2s,transform .25s}
.rail .brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.rail .brand .emb{width:40px;height:40px;flex-shrink:0;background:var(--emblem) center/contain no-repeat}
.rail .brand b{display:block;font-size:15.5px;font-weight:800;line-height:1.4}
.rail .brand span{display:block;font-size:11px;color:var(--mu2);margin-top:-3px}
.rail .brand .logo-sm{display:block;width:100%;height:15px;margin:2px 0 3px;background:var(--logo) right center/contain no-repeat;opacity:.95}
.rail.collapsed .brand .logo-sm{display:none}
/* NullGate brand logo */
.login-card .logo{display:block;height:34px;margin:0 auto 14px;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 4px 14px rgba(217,180,74,.4))}
.topbar .logo-h{width:116px;height:30px;flex-shrink:0;background:var(--logo) left center/contain no-repeat}
/* config-name format editor */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--gold-tx);font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:8px;cursor:pointer;transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--gold);color:var(--gold2)}
.cfg-prev{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;font-family:var(--mono);font-size:12px;direction:ltr;text-align:left;line-height:2.1;color:var(--mu);overflow-x:auto;white-space:nowrap}
.cfg-prev b{color:var(--gold-tx);font-weight:600}
.cfg-prev .bad{color:var(--red)}
.rail nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;scrollbar-width:none}
.rail nav::-webkit-scrollbar{display:none}
.rail .nav{display:flex;align-items:center;gap:12px;padding:0 13px;min-height:44px;border-radius:11px;color:var(--mu);font-weight:600;font-size:13.5px;text-align:start;transition:background .15s,color .15s;white-space:nowrap}
.rail .nav svg.i{width:21px;height:21px}
.rail .nav:hover{background:var(--card2);color:var(--tx)}
.rail .nav[aria-current=page]{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241b03;font-weight:800;box-shadow:0 6px 16px -6px rgba(217,180,74,.5)}
.rail .grow{flex:1}
.rail .me{display:flex;align-items:center;gap:10px;padding:10px 10px;border-top:1px solid var(--line2);white-space:nowrap}
.ava{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241b03;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14.5px}
.rail .me b{display:block;font-size:13px;font-weight:700;line-height:1.4;overflow:hidden;text-overflow:ellipsis}
.rail .me span{display:block;font-size:11px;color:var(--mu2);margin-top:-3px}
.rail .logout{display:flex;align-items:center;gap:12px;padding:0 13px;min-height:42px;border-radius:11px;color:var(--red);font-weight:600;font-size:13.5px;white-space:nowrap}
.rail .logout:hover{background:rgba(248,113,113,.08)}
.rail.collapsed{width:74px}
.rail.collapsed .brand div,.rail.collapsed .nav span,.rail.collapsed .me div,.rail.collapsed .logout span{display:none}
.rail.collapsed .brand,.rail.collapsed .me{justify-content:center;padding-inline:0}
.rail.collapsed .nav,.rail.collapsed .logout{justify-content:center;padding:0}
.scrim{position:fixed;inset:0;background:rgba(4,7,14,.6);backdrop-filter:blur(2px);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:1220px;margin:0 auto;padding:20px 24px 30px}

/* ═══════════════ topbar ═══════════════ */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
.burger{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--mu);flex-shrink:0}
.burger:hover{background:var(--card2);color:var(--tx)}
.topbar .emb{width:38px;height:38px;flex-shrink:0;background:var(--emblem) center/contain no-repeat}
.search{position:relative;flex:1;max-width:430px}
.search .i{position:absolute;top:50%;inset-inline-start:13px;transform:translateY(-50%);width:17px;height:17px;color:var(--mu2);pointer-events:none}
.search input{width:100%;min-height:41px;padding:0 40px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:13px}
.search input:focus{outline:none;border-color:var(--gold)}
.tact{display:flex;align-items:center;gap:4px;margin-inline-start:auto}
.tact .btn.icon{background:transparent;border-color:transparent;color:var(--mu);position:relative}
.tact .btn.icon:hover{background:var(--card2);color:var(--tx)}
.tact .dot{position:absolute;top:7px;inset-inline-end:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--bg);display:none}
.tact .dot.on{display:block}
.me-mini{display:flex;align-items:center;gap:9px;padding-inline-start:10px;margin-inline-start:4px;border-inline-start:1px solid var(--line2)}
.me-mini b{display:block;font-size:12.5px;font-weight:700;line-height:1.4;white-space:nowrap}
.me-mini span{display:block;font-size:10.5px;color:var(--mu2);margin-top:-3px}
.me-mini>div{min-width:0}

/* ═══════════════ hero ═══════════════ */
.hero{position:relative;height:212px;border-radius:var(--rad);overflow:hidden;background:var(--hero) center 32%/cover no-repeat;box-shadow:var(--sh);margin-bottom:16px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to left,rgba(7,10,20,.88) 8%,rgba(7,10,20,.45) 46%,rgba(7,10,20,.06) 78%)}
html[data-theme="light"] .hero::before{background:linear-gradient(to left,rgba(10,14,26,.82) 8%,rgba(10,14,26,.38) 46%,rgba(10,14,26,.04) 78%)}
.hero .ht{position:absolute;inset-inline-start:26px;top:50%;transform:translateY(-50%);max-width:420px}
.hero .ht .h1{display:inline-block;color:var(--gold-tx);font-size:12.5px;font-weight:600;padding-bottom:5px;border-bottom:2px solid var(--gold);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.hero .ht h2{margin:6px 0 4px;color:#fff;font-size:26px;font-weight:900;text-shadow:0 2px 14px rgba(0,0,0,.65)}
.hero .ht p{margin:0;color:#d5dceb;font-size:13px;text-shadow:0 1px 8px rgba(0,0,0,.6)}

/* ═══════════════ cards & grids ═══════════════ */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1.9fr 1fr;gap:14px;margin-bottom:16px;align-items:stretch}
.panel{background:var(--card);border:1px solid var(--line2);border-radius:var(--rad);padding:18px;box-shadow:var(--sh)}
.panel+.panel,.mt{margin-top:14px}
.panel h3{margin:0 0 3px;font-size:15px;font-weight:800}
.panel .sub{margin:0 0 14px;color:var(--mu);font-size:12px}
.sect-t{font-size:15px;font-weight:800;margin:0 0 11px}
.scard{background:var(--card);border:1px solid var(--line2);border-radius:var(--rad);padding:16px;display:flex;align-items:center;gap:13px;box-shadow:var(--sh);min-width:0}
.sic{width:46px;height:46px;flex-shrink:0;border-radius:13px;display:flex;align-items:center;justify-content:center}
.sic svg.i{width:22px;height:22px}
.sic.blue{background:rgba(91,140,255,.14);color:var(--blue)}
.sic.green{background:rgba(61,220,132,.13);color:var(--green)}
.sic.purple{background:rgba(167,139,250,.14);color:var(--purple)}
.sic.yellow{background:rgba(251,191,36,.13);color:var(--yellow)}
.sbody{min-width:0;flex:1}
.st{display:block;color:var(--mu);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv{display:flex;align-items:center;gap:8px;margin:2px 0}
.sv b{font-size:22px;font-weight:800;line-height:1.3;letter-spacing:-.2px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.badge svg.i{width:11px;height:11px;stroke-width:2.4}
.badge.up{color:var(--green);background:rgba(61,220,132,.12)}
.badge.down{color:var(--red);background:rgba(248,113,113,.12)}
.ss{display:block;color:var(--mu2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* server status */
.srv{flex-direction:column;align-items:stretch;gap:10px}
.srv .shead{display:flex;align-items:center;justify-content:space-between;color:var(--mu);font-size:12.5px;font-weight:600}
.srv .shead .ltr{font-size:11px;color:var(--mu2)}
.srv .srow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.srv .big{display:block;font-size:23px;font-weight:800;line-height:1.35;white-space:nowrap}
.srv .ss{margin-top:0}
.ring{width:62px;height:62px;flex-shrink:0}
.ring circle{fill:none;stroke-width:6.5;stroke-linecap:round}
.ring .tr{stroke:var(--line2)}
.ring text{font-size:12.5px;font-weight:800;fill:var(--tx)}
.nic{width:46px;height:46px;flex-shrink:0;border-radius:13px;background:rgba(56,189,248,.13);color:var(--cyan);display:flex;align-items:center;justify-content:center}
.nrow{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;font-family:var(--mono);direction:ltr;justify-content:flex-end}
.nrow svg.i{width:15px;height:15px;stroke-width:2.2}
.nrow.dl{color:var(--green)}.nrow.ul{color:var(--cyan)}

/* chart */
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding-top:3px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mu);font-weight:600;direction:ltr}
.legend i{width:9px;height:9px;border-radius:50%}
.chart-wrap{width:100%}
.chart-wrap svg{display:block;width:100%;height:196px}
.axis-t{font-size:10.5px;fill:var(--mu2);font-family:var(--mono)}

/* sysinfo */
.rows{margin:0}
.rows>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11.5px 0;border-top:1px solid var(--line2)}
.rows>div:first-child{border-top:0;padding-top:2px}
.rows dt{color:var(--mu);font-size:12.5px;flex-shrink:0}
.rows dd{margin:0;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;min-width:0;text-align:end}
.rows dd svg.i{width:16px;height:16px;color:var(--gold);stroke-width:1.9}
.rows dd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ═══════════════ users table ═══════════════ */
.tbl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.tbl{background:var(--card);border:1px solid var(--line2);border-radius:var(--rad);overflow:hidden;box-shadow:var(--sh)}
.trow,.thead{display:grid;grid-template-columns:46px minmax(120px,1.15fr) 108px minmax(150px,1.5fr) 84px 128px 92px;gap:10px;align-items:center;padding:12px 16px}
.thead{color:var(--mu2);font-size:11.5px;font-weight:700;border-bottom:1px solid var(--line2)}
.trow{border-bottom:1px solid var(--line2);cursor:pointer;transition:background .12s}
.trow:last-of-type{border-bottom:0}
.trow:hover{background:var(--card2)}
.trow .ava{width:34px;height:34px;border-radius:10px;font-size:13px}
.trow .uname{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .uname small{display:block;font-family:var(--mono);color:var(--mu2);font-size:10.5px;font-weight:400;margin-top:-2px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.status.ok{color:var(--green)}.status.ok i{background:var(--green);box-shadow:0 0 7px var(--green)}
.status.no{color:var(--red)}.status.no i{background:var(--red)}
.status.qt{color:var(--yellow)}.status.qt i{background:var(--yellow)}
.ucell{min-width:0}
.ucell .uv{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);font-family:var(--mono);direction:ltr;justify-content:flex-end;white-space:nowrap}
.ubar{height:5px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:6px}
.ubar b{display:block;height:100%;border-radius:6px;background:var(--green);transition:width .5s}
.ubar.warn b{background:var(--yellow)}
.ubar.full b{background:var(--red)}
.ubar.blue b{background:var(--cyan)}
.tcell{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcell b{color:var(--tx);font-weight:600;font-family:var(--mono);font-size:12.5px}
.tcell small{display:block;font-size:10.5px;margin-top:-2px}
.tcell small.ok{color:var(--green)}.tcell small.no{color:var(--red)}
.acts{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.acts button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--mu)}
.acts button:hover{background:var(--card2);color:var(--gold-tx)}
.acts svg.i{width:16.5px;height:16.5px}
.tbody-empty{padding:26px;text-align:center;color:var(--mu2);font-size:13px}

/* expandable details */
.tdetail{grid-column:1/-1;padding:4px 0 8px;cursor:default}
.trow.open{background:var(--card2)}
.tdetail .dinner{border-top:1px dashed var(--line);padding-top:12px;margin-top:10px}
.usage{margin-bottom:12px}
.usage .ur{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mu)}
.usage .ur b{color:var(--tx);font-weight:600;font-family:var(--mono);direction:ltr}
.usage .ubar{margin:6px 0 8px}
.urlrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.urlrow .u{flex:1;min-width:0;height:37px;display:flex;align-items:center;padding:0 11px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);font-family:var(--mono);font-size:11.5px;direction:ltr;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#9fb6e8}
.urlrow.sub .u{border-color:var(--gold-d);color:var(--gold-tx)}
.urlrow .btn.icon{width:34px;min-height:34px}
.cfg{margin-bottom:9px}
.cfg>small{display:block;margin-bottom:3px;font-size:11.5px;color:var(--mu)}
.tdetail h4{margin:13px 0 8px;font-size:12.5px;font-weight:700;color:var(--mu)}
.ed{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.ed .in{flex:1 1 130px;min-height:38px;border-radius:9px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ibf{margin-top:16px;padding-top:16px;border-top:1px solid var(--line2)}
.help{margin:0 0 14px;color:var(--mu);font-size:12.5px;line-height:1.9;background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.help b{color:var(--tx)}
.plist>div{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.plist>div:first-child{border-top:0;padding-top:2px}
.plist .pn{flex:1;min-width:0}
.plist b{display:block;font-weight:700;font-size:13.5px}
.plist small{display:block;color:var(--mu);font-size:12px}
.plist code,.steps code{font-family:var(--mono);font-size:11.5px;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;direction:ltr;unicode-bidi:isolate}
.steps{margin:12px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding-inline-start:38px;margin-bottom:10px;counter-increment:s;font-size:13px}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:2px;width:25px;height:25px;border-radius:50%;background:var(--card2);border:1px solid var(--gold-d);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gold-tx)}
.add{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.add .in{flex:1 1 150px}
.add .in.num{flex:0 1 110px}

/* ═══════════════ dropdown / dialog / toast ═══════════════ */
.pop{position:fixed;z-index:60;min-width:212px;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 18px 46px -10px rgba(0,0,0,.6);padding:6px;animation:popin .14s}
@keyframes popin{from{opacity:0;transform:translateY(-5px)}}
.pop .pi{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--tx);text-align:start}
.pop .pi svg.i{width:17px;height:17px;color:var(--mu)}
.pop .pi:hover{background:var(--card2)}
.pop .pi.danger,.pop .pi.danger svg.i{color:var(--red)}
.pop .pi.danger:hover{background:rgba(248,113,113,.08)}
.pop .pt{padding:7px 11px 3px;font-size:11px;font-weight:800;color:var(--mu2)}
.pop .ni{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;font-size:12.5px;line-height:1.6;color:var(--mu);border-top:1px solid var(--line2)}
.pop .ni:first-of-type{border-top:0}
.pop .ni b{color:var(--tx);font-weight:700}
.pop .ni svg.i{width:16px;height:16px;margin-top:3px;flex-shrink:0}
.pop .ni.ok svg.i{color:var(--green)}.pop .ni.warn svg.i{color:var(--yellow)}.pop .ni.bad svg.i{color:var(--red)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);padding:22px;width:min(92vw,360px);box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(4,7,14,.7)}
dialog p{margin:0 0 18px;font-size:13.5px}
dialog .acts{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:80}
#toast span{background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:var(--sh)}
#toast.show span{opacity:1;transform:none}
#toast.bad span{background:var(--red);color:#1a0505}

/* ═══════════════ footer ═══════════════ */
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1220px;width:100%;margin:0 auto;padding:14px 24px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);color:var(--mu2);font-size:12px}
.foot .fl{display:inline-flex;align-items:center;gap:9px}
.foot .fl i{width:26px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),transparent);display:inline-block}

/* ═══════════════ responsive ═══════════════ */
@media (max-width:1120px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:900px){
  .rail{position:fixed;inset-inline-start:0;top:0;transform:translateX(105%)}
  .rail.open{transform:none;box-shadow:0 0 80px rgba(0,0,0,.6)}
  .rail.collapsed{width:252px}
  .rail.collapsed .brand div,.rail.collapsed .nav span,.rail.collapsed .me div,.rail.collapsed .logout span{display:block}
  .rail.collapsed .brand,.rail.collapsed .me{justify-content:flex-start;padding-inline:8px 2px}
  .rail.collapsed .nav,.rail.collapsed .logout{justify-content:flex-start;padding:0 13px}
  .scrim.on{opacity:1;pointer-events:auto}
  .topbar{padding:10px 14px}
  main{padding:16px 14px 24px}
  .me-mini div{display:none}
  .me-mini{border-inline-start:0;padding-inline-start:0;margin-inline-start:0}
  .hero{height:180px}
  .hero .ht h2{font-size:21px}
}
@media (max-width:760px){
  .trow,.thead{grid-template-columns:40px minmax(90px,1fr) 92px minmax(110px,1.3fr) 84px}
  .tcell.hidem,.thead .hidem{display:none}
  .acts.hidem,.thead .hidem2{display:none}
}
@media (max-width:560px){
  .grid4{grid-template-columns:1fr 1fr;gap:10px}
  .scard{padding:13px}
  .sv b{font-size:18px}
  .sic{width:40px;height:40px;border-radius:11px}
  .hero{height:158px}
  .hero .ht{inset-inline-start:18px;max-width:300px}
  .hero .ht h2{font-size:18px}
  .login-slogan{inset-inline-start:18px;top:18px}
  .login-slogan .l2{font-size:18px}
  .topbar .emb,.topbar .logo-h{display:none}
  .thead{display:none}
  .trow{grid-template-columns:36px 1fr 84px;grid-template-areas:"ava name acts" "ava st st" "uc uc uc";row-gap:6px;padding:12px}
  .trow>.ava{grid-area:ava}
  .trow>.uname{grid-area:name}
  .trow>.acts{grid-area:acts}
  .trow>.status{grid-area:st}
  .trow>.ucell{grid-area:uc}
  .trow>.uexp{display:none}
  .trow>.tdetail{grid-column:1/-1}
}
@media (min-width:901px){#toast{bottom:26px}}
/* ══════════ v2.0.0 additions ══════════ */

dialog.modal{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);padding:0;width:min(580px,92vw);box-shadow:var(--sh)}

.qrwrap{display:flex;justify-content:center;padding:4px 0 2px}

.qrsub{word-break:break-all;direction:ltr;text-align:center;color:var(--mu);font-size:11.5px;margin-top:10px;font-family:var(--mono)}
.logview{font-family:var(--mono);font-size:11.5px;line-height:1.75;background:#0a0e18;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;max-height:52vh;overflow:auto;white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left;color:#9fb0d0}

.donut-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}

<!-- ═══════════ login ═══════════ -->
<div class="login" id="login" hidden>
  <div class="login-slogan"><span class="l1">برای آزادی</span><span class="l2">یک قدم جلوتر</span><span class="l3">اتصال امن، بدون محدودیت</span></div>
  <form class="login-card" id="loginForm">
    <div class="emb" role="img" aria-label="شیر و خورشید"></div>
    <div class="logo" role="img" aria-label="NullGate"></div>
    <h1>ورود به پنل کاربری</h1>
    <p>به دنیای بدون محدودیت خوش آمدید</p>
    <div class="in-wrap">
      <svg class="i"><use href="#i-user"/></svg>
      <input class="in" name="user" placeholder="نام کاربری" autocomplete="username" required>
    </div>
    <div class="in-wrap">
      <svg class="i"><use href="#i-lock"/></svg>
      <input class="in" name="pass" type="password" placeholder="رمز عبور" autocomplete="current-password" required>
      <button type="button" class="eye" id="eyeBtn" aria-label="نمایش رمز"><svg class="i"><use href="#i-eye"/></svg></button>
    </div>
    <div class="login-row">
      <label class="chk"><input type="checkbox" name="remember">مرا به خاطر بسپار</label>
      <button type="button" class="forgot" id="forgotBtn">رمز عبور را فراموش کرده‌اید؟</button>
    </div>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn gold">ورود</button>
  </form>
  <div class="login-quote"><b>قدرت در اتصال است</b><span>ایران، همیشه متصل</span></div>
</div>

<!-- ═══════════ app ═══════════ -->

  <aside class="rail" id="rail">
    <div class="brand">
      <div class="emb"></div>
      <div><div class="logo-sm" aria-hidden="true"></div><b>پنل مدیریت</b><span>اتصال فناوری آرزا</span></div>

      <div class="logo-h" aria-hidden="true"></div>

</div>

<script>
/* ═════════ helpers ═════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico = (n, cls = '') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const nf = n => new Intl.NumberFormat('en-US').format(n);

function jalali(ts) {
  const d = new Date(ts * 1000);
  let gy = d.getFullYear(), gm = d.getMonth() + 1, gd = d.getDate();
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = gy <= 1600 ? 0 : 979;
  gy -= gy <= 1600 ? 621 : 1600;
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + gdm[gm - 1];
  jy += 33 * Math.floor(days / 12053); days %= 12053;
  jy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  const jm = days < 186 ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
  return `${jy}/${String(jm).padStart(2, '0')}/${String(jd).padStart(2, '0')}`;
}
function size(b) {
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
  while (b >= 1024 && i < 4) { b /= 1024; i++; }
  return (i < 2 ? Math.round(b) : i === 2 ? b.toFixed(1) : b >= 100 ? Math.round(b) : b.toFixed(1)) + ' ' + u[i];
}
function gb(b) {
  const v = b / 2**30;
  return (v >= 100 ? Math.round(v) : v.toFixed(1)) + ' GB';
}
function dur(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d} روز و ${h} ساعت`;
  if (h) return `${h} ساعت و ${m} دقیقه`;
  return `${m} دقیقه`;
}
function mbps(Bs) {
  const v = Bs * 8 / 1e6;
  return (v >= 100 ? Math.round(v) : v >= 10 ? v.toFixed(0) : v.toFixed(1)) + ' Mbps';
}
function speed(b) {
  const u = ['B/s', 'KB/s', 'MB/s', 'GB/s']; let i = 0;
  while (b >= 1024 && i < 3) { b /= 1024; i++; }
  return [b >= 100 || i === 0 ? Math.round(b) : b.toFixed(1), u[i]];
}

/* ═════════ api ═════════ */
async function api(path, body) {
  const opt = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const r = await fetch('/panel/api/' + path, { credentials: 'same-origin', cache: 'no-store', ...opt });
  if (r.status === 401 && path !== 'login') { showLogin(); throw new Error('unauthorized'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'خطا در ارتباط با سرور');
  return d;
}

/* ═════════ toast / confirm / popup ═════════ */
let toastT;
function toast(msg, bad) {
  const t = $('#toast');
  t.className = 'show' + (bad ? ' bad' : '');
  t.firstElementChild.textContent = msg;
  clearTimeout(toastT);
  toastT = setTimeout(() => t.className = '', 2000);
}
function ask(msg, yes) {
  return new Promise(res => {
    const d = $('#dlg'); $('#dlgMsg').textContent = msg; $('#dlgYes').textContent = yes || 'حذف';
    const done = v => { d.close(); res(v); };
    $('#dlgYes').onclick = () => done(true);
    $('#dlgNo').onclick = () => done(false);
    d.oncancel = () => res(false);
    d.showModal();
  });
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t);
    t.select(); document.execCommand('copy'); t.remove();
  }
  toast('کپی شد');
}
function closePop() { const p = $('#pop'); p.hidden = true; p.innerHTML = ''; }
function openPop(anchor, html) {
  const p = $('#pop');
  p.innerHTML = html; p.hidden = false;
  const r = anchor.getBoundingClientRect();
  p.style.visibility = 'hidden'; p.style.left = '0'; p.style.top = '0';
  requestAnimationFrame(() => {
    const pw = p.offsetWidth, ph = p.offsetHeight;
    let x = r.right - pw;
    x = Math.max(8, Math.min(x, innerWidth - pw - 8));
    let y = r.bottom + 8;
    if (y + ph > innerHeight - 8) y = Math.max(8, r.top - ph - 8);
    p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.visibility = '';
  });
}
document.addEventListener('click', e => { if (!e.target.closest('#pop') && !e.target.closest('#bellBtn')) closePop(); }, true);

/* ═════════ theme ═════════ */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('theme', t);
  $('#themeBtn').innerHTML = ico(t === 'light' ? 'moon' : 'sun');
}
applyTheme(localStorage.getItem('theme') || 'dark');
$('#themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');

/* ═════════ shell & nav ═════════ */
const TABS = [
  ['dashboard', 'داشبورد', 'home'],
  ['clients', 'کاربران', 'users'],
  ['conns', 'اتصال‌ها', 'globe'],
  ['subs', 'اشتراک‌ها', 'cal'],
  ['settings', 'تنظیمات', 'gear'],
  ['reports', 'گزارشات', 'chart'],
  ['tools', 'ابزارها', 'wrench'],
  ['support', 'پشتیبانی', 'headset'],
];
let tab = localStorage.getItem('tab') || 'dashboard';
let S = null, ST = null;
let pollTimer = null;
const openRows = new Set();
let searchTerm = '';

function buildNav() {
  $('#nav').innerHTML = TABS.map(([k, l, i]) => `<button class="nav" data-tab="${k}">${ico(i)}<span>${l}</span></button>`).join('');
  $$('#nav [data-tab]').forEach(b => b.onclick = () => { go(b.dataset.tab); closeRail(); });
  $('#logoutBtn').onclick = async () => { await api('logout', {}).catch(() => {}); showLogin(); };
}
function setMe() {
  const name = (S && S.settings && S.settings.user) || 'admin';
  const letter = [...name.trim()][0] || 'م';

  $('#meName2').textContent = name;

}
function showLogin() {

  $('#app').hidden = true; $('#login').hidden = false;
  $('#loginForm').pass.value = '';
  $('#loginForm').user.value = localStorage.getItem('ng_user') || '';
  if (localStorage.getItem('ng_user')) $('#loginForm').remember.checked = true;
}
async function enter() {
  $('#login').hidden = true; $('#app').hidden = false;
  S = await api('state');
  setMe();
  go(tab);
}
function go(t) {
  if (!TABS.some(x => x[0] === t)) t = 'dashboard';
  tab = t; localStorage.setItem('tab', t);
  $$('#nav [data-tab]').forEach(b => { if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });

$('#burgerBtn').onclick = () => {

/* ═════════ login form ═════════ */
$('#eyeBtn').onclick = () => {

  p.type = show ? 'text' : 'password';

};

$('#loginForm').onsubmit = async e => {

try {

<script>
/* ═════════ chart renderer ═════════ */
const CHART_COLORS = { cpu: '#3ddc84', ram: '#5b8cff', disk: '#a78bfa', net: '#38bdf8' };
function drawChart(el, series, labels) {
  if (!el) return;
  const W = 600, H = 200, padL = 30, padR = 8, padT = 10, padB = 22;
  const iw = W - padL - padR, ih = H - padT - padB;
  const n = Math.max(...series.map(s => s.data.length));
  if (n < 2) { el.innerHTML = ''; return; }
  const x = i => padL + i / (n - 1) * iw;
  const y = v => padT + (1 - Math.max(0, Math.min(100, v)) / 100) * ih;
  let g = '';
  for (const gv of [0, 25, 50, 75, 100]) {
    g += `<line x1="${padL}" y1="${y(gv)}" x2="${W - padR}" y2="${y(gv)}" stroke="var(--line2)" stroke-width="1" ${gv ? 'stroke-dasharray="3 4"' : ''}/>`;
    g += `<text class="axis-t" x="${padL - 7}" y="${y(gv) + 3.5}" text-anchor="end">${gv}</text>`;
  }
  for (const lb of (labels || [])) {
    g += `<text class="axis-t" x="${x(lb.i)}" y="${H - 6}" text-anchor="middle">${lb.t}</text>`;
  }
  for (const s of series) {
    const pts = s.data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  }
  el.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.innerHTML = g;
}
function ring(pct, color, label, id) {
  return `<svg class="ring" ${id ? `id="${id}"` : ''} viewBox="0 0 62 62" role="img" aria-label="${label}">
    <circle class="tr" cx="31" cy="31" r="26"/>
    <circle cx="31" cy="31" r="26" pathLength="100" stroke="${color}" stroke-dasharray="${Math.max(0, Math.min(100, pct))} 100" transform="rotate(-90 31 31)"/>
    <text x="31" y="35.5" text-anchor="middle">${Math.round(pct)}%</text></svg>`;
}

/* ═════════ notifications ═════════ */
function issues() {
  const out = [];
  if (!S) return out;
  if (!S.xray.running) out.push(['bad', 'xray', 'Xray متوقف است', 'سرویس در حال حاضر اجرا نمی‌شود.']);
  const exp = S.clients.filter(c => c.status === 'expired');
  const qt = S.clients.filter(c => c.status === 'quota');
  if (exp.length) out.push(['bad', 'clock', 'کاربران منقضی‌شده', exp.map(c => c.name).join('، ')]);
  if (qt.length) out.push(['warn', 'info', 'حجم تمام‌شده', qt.map(c => c.name).join('، ')]);
  if (ST && ST.disk && ST.disk.percent >= 85) out.push(['warn', 'db', 'فضای دیسک پر است', `${ST.disk.used} از ${ST.disk.total} گیگابایت استفاده شده`]);
  if (ST && ST.cpu >= 90) out.push(['warn', 'xray', 'پردازنده زیر فشار است', `مصرف CPU روی ${Math.round(ST.cpu)}% است`]);
  return out;
}
function renderIssues() {
  const list = issues();
  $('#bellDot').classList.toggle('on', list.length > 0);
  return list;
}
$('#bellBtn').onclick = e => {
  e.stopPropagation();
  if (!$('#pop').hidden) return closePop();
  const list = renderIssues();
  const html = `<div class="pt">اعلان‌ها</div>` + (list.length
    ? list.map(([lv, ic, b, d]) => `<div class="ni ${lv}">${ico(ic)}<span><b>${esc(b)}</b><br>${esc(d)}</span></div>`).join('')
    : `<div class="ni ok">${ico('check')}<span><b>همه چیز مرتب است</b><br>هیچ هشداری وجود ندارد.</span></div>`);
  openPop(e.currentTarget, html);
};
</script>
<script>
function timeLabels(n, interval) {
  const step = Math.max(1, Math.floor((n - 1) / 5));
  const span = (n - 1) * (interval || 2);
  const out = [];
  for (let i = n - 1; i >= 0; i -= step) {
    const d = new Date(Date.now() - (n - 1 - i) * (interval || 2) * 1000);
    const t = span <= 900
      ? `${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`
      : `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    out.push({ i, t });
  }
  return out;
}
async function refreshLive() {
  let d;
  try { d = await api('stats'); } catch { return; }
  if (tab !== 'dashboard' || !$('#ringCpu')) return;
  ST = d;
  $('#ringCpu').outerHTML = ring(d.cpu, CHART_COLORS.cpu, 'CPU', 'ringCpu');
  $('#ringRam').outerHTML = ring(d.mem, CHART_COLORS.ram, 'RAM', 'ringRam');
  $('#ringDisk').outerHTML = ring(d.disk.percent, CHART_COLORS.disk, 'Storage', 'ringDisk');
  $('#vCpu').textContent = Math.round(d.cpu) + '%';
  $('#vCpuSub').textContent = d.cpu_model || 'پردازنده سرور';
  $('#vRam').textContent = `${(d.mem_used / 1024).toFixed(1)} / ${(d.mem_total / 1024).toFixed(0)} GB`;
  $('#vDisk').textContent = `${d.disk.used} / ${d.disk.total} GB`;
  $('#vNetDl').textContent = mbps(d.rx);
  $('#vNetUl').textContent = mbps(d.tx);
  const up2 = $('#vUp2'); if (up2) up2.textContent = dur(d.uptime);
  const upBig = $('#tUpBig');
  if (upBig) upBig.textContent = d.uptime >= 86400 ? `${Math.floor(d.uptime / 86400)} روز` : `${Math.floor(d.uptime / 3600)} ساعت`;
  const osVal = $('#osVal'); if (osVal) osVal.textContent = d.os || 'Linux';
  const t30 = d.traffic30;
  const b30 = $('#t30Badge');
  if (b30) b30.innerHTML = t30 && t30.pct !== null && t30.pct !== undefined
    ? `<span class="badge ${t30.pct >= 0 ? 'up' : 'down'}">${ico(t30.pct >= 0 ? 'arrup' : 'arrdown')}${Math.abs(t30.pct)}%</span>` : '';
  const s30 = $('#t30Sub');
  if (s30) s30.textContent = t30 && t30.bytes ? 'در ۳۰ روز اخیر' : 'مجموع مصرف کاربران';
  const n = d.hist.cpu.length, interval = d.interval || 2;
  const net = d.hist.rx.map((v, i) => {
    const mx = Math.max(1, ...d.hist.rx, ...d.hist.tx);
    return Math.min(97, (v + d.hist.tx[i]) / mx * 90 + 4);
  });
  const series = [
    { color: CHART_COLORS.cpu, data: d.hist.cpu },
    { color: CHART_COLORS.ram, data: d.hist.mem },
    { color: CHART_COLORS.disk, data: new Array(n).fill(d.disk.percent) },
    { color: CHART_COLORS.net, data: net },
  ];
  drawChart($('#resChart'), series, timeLabels(n, interval));
  renderIssues();
}

/* ═════════ client components ═════════ */
function stMeta(c) {
  if (c.status === 'expired') return ['no', 'منقضی شده'];
  if (c.status === 'quota') return ['qt', 'حجم تمام شد'];
  return ['ok', 'فعال'];
}
function lifeCell(c) {
  if (!c.expire_at) return `<b class="ltr">∞</b><small>نامحدود</small>`;
  if (c.status === 'expired') return `<b class="ltr">${jalali(c.expire_at)}</b><small class="no">منقضی شده</small>`;
  return `<b class="ltr">${jalali(c.expire_at)}</b><small class="${c.days_left <= 3 ? 'no' : 'ok'}">باقی ${c.days_left} روز</small>`;
}
function usageCell(c, compact) {
  const used = c.up + c.down, pct = c.quota ? Math.min(100, used / c.quota * 100) : 0;
  const cls = pct >= 100 ? 'full' : pct >= 85 ? 'warn' : c.quota === 0 ? 'blue' : '';
  return `<div class="ucell">
    <div class="uv"><b>${size(used)}</b>${compact ? '' : `<span>/ ${c.quota ? size(c.quota) : '∞'}</span>`}</div>
    <div class="ubar ${cls}"><b style="width:${c.quota ? Math.max(pct, 3) : (used ? 8 : 2)}%"></b></div>
  </div>`;
}
function clientRow(c) {
  const open = openRows.has(c.id);
  const [stc, stl] = stMeta(c);
  const letter = [...c.name.trim()][0]?.toUpperCase() || '?';
  return `<div class="trow ${open ? 'open' : ''}" data-id="${esc(c.id)}" role="button" tabindex="0" aria-expanded="${open}">
    <span class="ava">${esc(letter)}</span>
    <div class="uname">${esc(c.name)}${c.main ? ' <span class="badge up" style="margin-inline-start:4px">اصلی</span>' : ''}<small class="ltr">${esc(c.id.slice(0, 8))}…</small></div>
    <span class="status ${stc}"><i></i>${stl}</span>
    ${usageCell(c)}
    <div class="tcell uexp"><b>${c.quota ? size(c.quota) : '∞'}</b></div>
    <div class="tcell uexp">${lifeCell(c)}</div>
    <div class="acts">
      <input type="checkbox" class="ckb" data-sel aria-label="انتخاب ${esc(c.name)}" title="انتخاب برای عملیات گروهی">
      <button data-act="edit" aria-label="ویرایش">${ico('edit')}</button>
      <button data-act="menu" aria-label="بیشتر">${ico('dots')}</button>
    </div>
    ${open ? `<div class="tdetail"><div class="dinner">${clientDetail(c)}</div></div>` : ''}
  </div>`;
}
function clientDetail(c) {
  const used = c.up + c.down, pct = c.quota ? Math.min(100, used / c.quota * 100) : 0;
  const life = !c.expire_at ? 'نامحدود' : c.status === 'expired' ? 'منقضی شده' : `${c.days_left} روز مانده`;
  const isDefault = !(c.protocols || []).length;
  const chips = (S.protocols || []).map(p => {
    const on = isDefault || (c.protocols || []).includes(p.key);
    const short = p.key === 'vless-reality' ? 'Reality' : (p.name.split(' · ')[1] || p.name);
    return `<button type="button" class="chip2 ${on ? 'on' : ''}" data-proto="${p.key}">${esc(short)}</button>`;
  }).join('');
  return `
    <div class="usage"><div class="ur"><span>مصرف از حجم کل</span><b>${size(used)} / ${c.quota ? size(c.quota) : 'نامحدود'}</b></div>
      <div class="ubar ${pct >= 100 ? 'full' : pct >= 85 ? 'warn' : ''}"><b style="width:${c.quota ? pct : 0}%"></b></div>
      <div class="ur"><span>اعتبار</span><b style="font-family:inherit">${life}</b></div></div>
    <h4>لینک اشتراک (همه کانفیگ‌ها یکجا)</h4>
    <div class="urlrow sub"><div class="u">${esc(c.sub_url)}</div>
      <button class="btn icon" data-act="sub" aria-label="کپی لینک اشتراک">${ico('copy')}</button>
      <button class="btn icon" data-act="qrsub" aria-label="QR لینک اشتراک">${ico('qr')}</button>
      <button class="btn icon" data-act="json" aria-label="کانفیگ JSON بهینه">${ico('arrdown')}</button></div>
    <h4>کانفیگ‌های تکی</h4>
    ${c.links.map((l, i) => `<div class="cfg"><small>${esc(l.label)}</small><div class="urlrow"><div class="u">${esc(l.url)}</div><button class="btn icon" data-act="cfg" data-i="${i}" aria-label="کپی">${ico('copy')}</button><button class="btn icon" data-act="cfgqr" data-i="${i}" aria-label="QR این کانفیگ">${ico('qr')}</button></div></div>`).join('')}
    ${(S.protocols || []).length ? `<h4>پروتکل‌های این کاربر</h4>
    <label class="chk"><input type="checkbox" name="pdefault" ${isDefault ? 'checked' : ''}>همه پروتکل‌های سرور (پیش‌فرض)</label>
    <div class="chips2 ${isDefault ? 'locked' : ''}">${chips}</div>
    <small style="display:block;margin-top:2px;color:var(--mu2);font-size:11.5px">با خاموش کردن «پیش‌فرض» می‌توانید پروتکل‌های خاصی را برای این کاربر فعال نگه دارید</small>` : ''}
    <h4>ویرایش کاربر</h4>
    <form class="ed"><input class="in" name="name" value="${esc(c.name)}" maxlength="30" placeholder="نام کاربر" style="max-width:150px"><input class="in" name="quota_gb" type="number" min="0" step="any" placeholder="حجم جدید (GB)"><input class="in" name="days" type="number" min="0" step="1" placeholder="تمدید (روز از امروز)">
      <input class="in" name="note" value="${esc(c.note || '')}" maxlength="140" placeholder="یادداشت مدیر" style="max-width:190px">
      <label class="chk"><input type="checkbox" name="reset_usage">صفر کردن مصرف</label><button class="btn gold sm">ذخیره</button></form>
    <small style="display:block;margin-top:6px;color:var(--mu2);font-size:11.5px">خالی = بدون تغییر · ۰ = نامحدود</small>
    ${c.main ? '' : `<button class="btn ghost-gold sm" data-act="regen" style="margin-top:10px">${ico('refresh')}بازتولید UUID (تعویض همه لینک‌ها)</button>
    <button class="btn bad sm" data-act="del" style="margin-top:10px">${ico('trash')}حذف کاربر</button>`}`;
}
function wireClientRow(row) {
  const c = S.clients.find(x => x.id === row.dataset.id);
  if (!c) return;
  const toggle = () => {
    row.classList.toggle('open');
    const isOpen = row.classList.contains('open');
    row.setAttribute('aria-expanded', isOpen);
    isOpen ? openRows.add(c.id) : openRows.delete(c.id);
    let d = row.querySelector('.tdetail');
    if (isOpen) {
      if (!d) { d = document.createElement('div'); d.className = 'tdetail'; row.appendChild(d); }
      d.innerHTML = `<div class="dinner">${clientDetail(c)}</div>`;
      wireDetail(row, c);
      wireActs();
    } else if (d) d.remove();
  };
  row.onclick = e => { if (!e.target.closest('[data-act]') && !e.target.closest('form') && !e.target.closest('.tdetail') && !e.target.closest('[data-sel]')) toggle(); };
  row.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === row) { e.preventDefault(); toggle(); } };
  const wireActs = () => {
    row.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = async e => {
      e.stopPropagation();
      const act = b.dataset.act;
      if (act === 'sub') return copy(c.sub_url);
      if (act === 'cfg') return copy(c.links[+b.dataset.i].url);
      if (act === 'qrsub') return showQR(c.name, c.sub_url);
      if (act === 'cfgqr') return showQR(c.name + ' · ' + c.links[+b.dataset.i].label, c.links[+b.dataset.i].url);
      if (act === 'json') return showJSON(c);
      if (act === 'edit') return toggle();
      if (act === 'menu') return rowMenu(b, c);
      if (act === 'regen' && await ask('UUID جدید ساخته شود؟ لینک ساب و همه کانفیگ‌های این کاربر عوض می‌شود.')) {
        try { await api('clients/regen', { id: c.id }); openRows.delete(c.id); S = await api('state'); toast('UUID جدید ساخته شد'); viewClients(); }
        catch (er) { toast(er.message, true); }
        return;
      }
      if (act === 'del' && await ask(`کاربر «${c.name}» حذف شود؟ کانفیگ‌های او از کار می‌افتد.`)) {
        try { await api('clients/delete', { id: c.id }); openRows.delete(c.id); S = await api('state'); toast('کاربر حذف شد'); viewClients(); }
        catch (er) { toast(er.message, true); }
      }
    };
  });
  };
  wireActs();
  const cb = row.querySelector('[data-sel]');
  if (cb) {
    cb.checked = sel.has(c.id);
    cb.onclick = e => e.stopPropagation();
    cb.onchange = () => { cb.checked ? sel.add(c.id) : sel.delete(c.id); updateBulkbar(); };
  }
  if (row.classList.contains('open')) wireDetail(row, c);
}
function wireDetail(row, c) {
  const f = row.querySelector('.ed');
  if (f) {
    const chips = [...row.querySelectorAll('.chip2')];
    const pd = f.pdefault;
    if (pd) {
      pd.onchange = () => {
        const box = row.querySelector('.chips2');
        box.classList.toggle('locked', pd.checked);
        if (pd.checked) chips.forEach(ch => ch.classList.remove('on'));
        else chips.forEach(ch => ch.classList.add('on'));
      };
      chips.forEach(ch => ch.onclick = () => { if (!pd.checked) ch.classList.toggle('on'); });
    }
    f.onsubmit = async e => {
      e.preventDefault();
      const protocols = (!pd || pd.checked) ? [] : chips.filter(ch => ch.classList.contains('on')).map(ch => ch.dataset.proto);
      try {
        await api('clients/update', { id: c.id, quota_gb: f.quota_gb.value, days: f.days.value, reset_usage: f.reset_usage.checked, name: f.name.value, note: f.note.value, protocols });
        S = await api('state'); toast('ذخیره شد'); viewClients();
      } catch (er) { toast(er.message, true); }
    };
  }
}
function rowMenu(btn, c) {
  const [stc, stl] = stMeta(c);
  openPop(btn, `<div class="pt">${esc(c.name)} · ${stl}</div>
    <button class="pi" data-m="sub">${ico('link')}کپی لینک ساب</button>
    <button class="pi" data-m="qrsub">${ico('qr')}نمایش QR ساب</button>
    <button class="pi" data-m="json">${ico('arrdown')}کانفیگ JSON بهینه</button>
    <button class="pi" data-m="edit">${ico('edit')}ویرایش و جزئیات</button>
    ${c.main ? '' : `<button class="pi danger" data-m="del">${ico('trash')}حذف کاربر</button>`}`);
  $$('#pop [data-m]').forEach(b => b.onclick = async () => {
    const m = b.dataset.m; closePop();
    const row = $(`.trow[data-id="${c.id}"]`);
    if (m === 'sub') return copy(c.sub_url);
    if (m === 'qrsub') return showQR(c.name, c.sub_url);
    if (m === 'json') return showJSON(c);
    if (m === 'edit') { if (row && !row.classList.contains('open')) row.click(); row?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    if (m === 'del' && await ask(`کاربر «${c.name}» حذف شود؟ کانفیگ‌های او از کار می‌افتد.`)) {
      try { await api('clients/delete', { id: c.id }); openRows.delete(c.id); S = await api('state'); toast('کاربر حذف شد'); viewClients(); }
      catch (er) { toast(er.message, true); }
    }
  });
}
</script>
<script>
/* ═════════ dashboard ═════════ */
function statCard(icon, color, title, value, badge, sub) {
  return `<div class="scard">
    <div class="sic ${color}">${ico(icon)}</div>
    <div class="sbody"><span class="st">${title}</span>
      <div class="sv"><b>${value}</b>${badge}</div>
      <span class="ss">${sub}</span></div></div>`;
}
function viewDashboard() {
  const cs = S.clients;
  const active = cs.filter(c => c.status === 'active').length;
  const totalUsed = cs.reduce((a, c) => a + c.up + c.down, 0);
  const protoCount = (S.protocols?.length || 0) + (S.inbounds?.length || 0);
  const t30 = ST && ST.traffic30 ? ST.traffic30 : null;
  const t30Badge = t30 && t30.pct !== null && t30.pct !== undefined
    ? `<span class="badge ${t30.pct >= 0 ? 'up' : 'down'}">${ico(t30.pct >= 0 ? 'arrup' : 'arrdown')}${Math.abs(t30.pct)}%</span>` : '';
  const t30Sub = t30 && t30.bytes ? 'در ۳۰ روز اخیر' : 'مجموع مصرف کاربران';
  const daysUp = ST ? Math.floor(ST.uptime / 86400) : 0;
  const upBadge = S.xray.running ? '<span class="badge up">پایدار</span>' : '<span class="badge down">توقف</span>';
  const recent = [...cs].slice(-5).reverse();
  $('#view').innerHTML = `
    <div class="hero"><div class="ht"><span class="h1">آزادی در دستان توست</span><h2>ایران، همیشه آزاد</h2><p>اتصال پایدار، سرعت بالا، بدون محدودیت</p></div></div>
    <div class="grid4">
      ${statCard('users', 'blue', 'تعداد کاربران', nf(cs.length), active ? `<span class="badge up">${ico('arrup')}${nf(active)}</span>` : '', 'کاربر در سیستم')}
      ${statCard('globe', 'green', 'تعداد اتصال‌ها', nf(protoCount), '', 'پروتکل و اینباند فعال')}
      ${statCard('db', 'purple', 'کل مصرف ترافیک', gb(totalUsed), `<span id="t30Badge">${t30Badge}</span>`, `<span id="t30Sub">${t30Sub}</span>`)}
      ${statCard('shield', 'yellow', 'زمان فعالیت', `<span id="tUpBig">${ST ? `${daysUp} روز` : '—'}</span>`, upBadge, 'پایداری سرویس')}
    </div>
    <p class="sect-t">وضعیت سرور</p>
    <div class="grid4">
      <div class="scard srv"><div class="shead"><span>CPU</span></div>
        <div class="srow"><div><b class="big" id="vCpu">–</b><span class="ss" id="vCpuSub">…</span></div><span id="ringCpu"></span></div></div>
      <div class="scard srv"><div class="shead"><span>RAM</span></div>
        <div class="srow"><div><b class="big ltr" id="vRam">–</b><span class="ss">حافظه در حال استفاده</span></div><span id="ringRam"></span></div></div>
      <div class="scard srv"><div class="shead"><span>Storage</span></div>
        <div class="srow"><div><b class="big ltr" id="vDisk">–</b><span class="ss">فضای ذخیره‌سازی</span></div><span id="ringDisk"></span></div></div>
      <div class="scard srv"><div class="shead"><span>Network</span></div>
        <div class="srow"><div><div class="nrow dl">${ico('arrdown')}<span id="vNetDl">–</span></div><div class="nrow ul" style="margin-top:2px">${ico('arrup')}<span id="vNetUl">–</span></div></div>
          <span class="nic">${ico('wifi')}</span></div></div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="chart-head"><h3>نمودار مصرف منابع</h3>
        <div class="legend"><span><i style="background:${CHART_COLORS.cpu}"></i>CPU</span><span><i style="background:${CHART_COLORS.ram}"></i>RAM</span><span><i style="background:${CHART_COLORS.disk}"></i>Storage</span><span><i style="background:${CHART_COLORS.net}"></i>Network</span></div></div>
        <div class="chart-wrap"><svg id="resChart"></svg></div></div>
      <div class="panel"><h3>اطلاعات سیستم</h3><p class="sub">مشخصات سرور و نسخه پنل</p>
        <dl class="rows">
          <div><dt>نام سرور</dt><dd><span>IR-VPN-01</span>${ico('server')}</dd></div>
          <div><dt>لوکیشن</dt><dd><span>تهران، ایران</span>${ico('pin')}</dd></div>
          <div><dt>سیستم عامل</dt><dd><span class="ltr" id="osVal">${esc(ST && ST.os ? ST.os : 'Linux')}</span>${ico('gear')}</dd></div>
          <div><dt>مدت زمان فعالیت</dt><dd><span id="vUp2">…</span>${ico('clock')}</dd></div>
          <div><dt>نسخه پنل</dt><dd><span class="ltr">v${esc(S.version || '2.0.1')}</span>${ico('layers')}</dd></div>
        </dl></div>
    </div>
    <div class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h3>انقضای نزدیک</h3><p class="sub">کاربرانی که در ۷ روز آینده اعتبارشان تمام می‌شود</p></div>
      <button class="btn ghost-gold sm" data-go="clients">مدیریت کاربران</button></div>
      ${(() => {
        const soon = cs.filter(c => c.expire_at && c.status === 'active' && c.days_left <= 7).sort((a, b) => a.days_left - b.days_left).slice(0, 6);
        if (!soon.length) return '<p class="sub" style="margin:8px 0 2px">هیچ کاربری در آستانه انقضا نیست — همه چیز مرتب است.</p>';
        return `<div class="mini-list">${soon.map(c => `<div class="mr"><span style="display:flex;align-items:center;gap:9px"><span class="ava" style="width:30px;height:30px;font-size:13px">${esc([...c.name.trim()][0]?.toUpperCase() || '?')}</span>${esc(c.name)}</span>
          <span class="status ${c.days_left <= 2 ? 'no' : 'qt'}"><i></i>${c.days_left} روز مانده</span></div>`).join('')}</div>`;
      })()}
    </div>
    <div class="panel" style="padding:0"><div class="tbl-head" style="padding:16px 16px 0;margin-bottom:6px"><h3>کاربران اخیر</h3>
      <button class="btn ghost-gold sm" data-go="clients">مشاهده همه</button></div>
      <div class="thead"><span>آواتار</span><span>نام کاربری</span><span>وضعیت</span><span>مصرف حجم</span><span class="hidem">حجم کل</span><span class="hidem">تاریخ انقضا</span><span class="hidem2" style="text-align:end">اقدامات</span></div>
      ${recent.length ? recent.map(clientRow).join('') : '<div class="tbody-empty">هنوز کاربری ثبت نشده است</div>'}
    </div>`;
  $$('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $$('#view .trow').forEach(wireClientRow);
  refreshLive(); pollTimer = setInterval(refreshLive, 2500);
  if (ST) $('#vUp2').textContent = dur(ST.uptime);
}

/* ═════════ clients ═════════ */
function viewClients() {
  const list = S.clients.filter(c => !searchTerm || c.name.toLowerCase().includes(searchTerm) || c.id.includes(searchTerm));
  $('#view').innerHTML = `
    <form class="add" id="addForm"><input class="in" name="name" maxlength="30" placeholder="نام کاربر جدید" required><input class="in num" name="quota_gb" type="number" min="0" step="any" placeholder="حجم (GB)"><input class="in num" name="days" type="number" min="0" step="1" placeholder="روز"><button class="btn gold">${ico('plus')}افزودن</button></form>
    <details class="help"><summary style="cursor:pointer;font-weight:700;color:var(--tx)">راهنما: ورود همه کانفیگ‌ها با یک لینک</summary>
      <div style="margin-top:8px">دکمه «کپی لینک ساب» را بزنید و لینک را در کلاینت به‌عنوان اشتراک (Subscription) اضافه کنید.<br>
      در <bdi>v2rayNG</bdi>: منو، سپس <bdi>Subscription group setting</bdi>، افزودن (+)، چسباندن لینک، و در پایان <bdi>Update subscription</bdi>.<br>
      در <bdi>Hiddify</bdi> و <bdi>Streisand</bdi> و <bdi>V2Box</bdi>: افزودن پروفایل از کلیپ‌بورد. برای اسکن سریع روی گوشی، دکمه QR هر کاربر را بزنید.<br>
      حجم یا روز خالی / ۰ = نامحدود. با تمام شدن حجم یا گذشتن مدت، کانفیگ کاربر خودکار قطع می‌شود و با تمدید دوباره فعال می‌شود.</div></details>

      <button class="btn ghost-gold sm" data-bulk="reset">${ico('refresh')}صفر کردن مصرف</button>
      <button class="btn bad sm" data-bulk="delete">${ico('trash')}حذف</button>

      ${list.length ? list.map(clientRow).join('') : `<div class="tbody-empty">${searchTerm ? 'نتیجه‌ای برای جستجوی شما پیدا نشد' : 'هنوز کاربری ثبت نشده — از فرم بالا اضافه کنید'}</div>`}
    </div>`;
  $('#addForm').onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button'); btn.disabled = true;

}

/* ═════════ conns (protocols) ═════════ */
function viewConns() {
  const t = S.tcp;
  const tcpBody = t.enabled
    ? `<dl class="rows" style="margin:0">
         <div><dt>آدرس</dt><dd class="ltr">${esc(t.host)}:${esc(t.port)}</dd></div>
         <div><dt>پورت داخلی</dt><dd class="ltr">${t.app_port}</dd></div>
         <div><dt>SNI (Reality)</dt><dd class="ltr">${esc(t.sni)}</dd></div>

       ${t.key_ok ? `<ol class="steps">
         <li>در Railway وارد سرویس شوید: <code>Settings ← Networking ← TCP Proxy</code></li>

    <div class="panel"><h3>پشت دامنه Railway</h3><p class="sub">همه روی HTTPS و یک پورت عبور می‌کنند و بر اساس مسیر جدا می‌شوند.</p>
      <div class="plist">${S.protocols.map(p => `<div><div class="pn"><b>${esc(p.name)}</b><small>${esc(p.note)}</small></div><code>${esc(p.path)}</code></div>`).join('')}</div></div>
    <div class="panel mt"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h3>VLESS · Reality روی TCP Proxy</h3><p class="sub">اتصال مستقیم TCP بدون دامنه و CDN</p></div>
      <span class="status ${t.enabled ? 'ok' : 'no'}"><i></i>${t.enabled ? 'فعال' : 'غیرفعال'}</span></div>${tcpBody}</div>
    <div class="panel mt"><h3>اینباند سفارشی</h3><p class="sub">ساخت اینباند با پروتکل و ترنسپورت دلخواه در بخش «ابزارها» انجام می‌شود.</p>
      <button class="btn ghost-gold sm" data-go="tools">${ico('wrench')}رفتن به ابزارها</button></div>`;
  $$('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
}

/* ═════════ subs ═════════ */
function viewSubs() {
  $('#view').innerHTML = `
    <div class="help"><b>لینک اشتراک چیست؟</b> با یک لینک، همه پروتکل‌ها (WS، XHTTP، HTTPUpgrade، VMess، Trojan و Reality) یکجا وارد کلاینت می‌شوند و با هر تغییر، خودکار به‌روز می‌شوند. توکن هر کاربر ثابت است و با دیپلوی مجدد عوض نمی‌شود.</div>
    ${S.clients.length ? S.clients.map(c => {
      const [stc, stl] = stMeta(c);
      return `<div class="panel mt"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:11px;min-width:0"><span class="ava">${esc([...c.name.trim()][0]?.toUpperCase() || '?')}</span>

        <button class="btn gold sm" data-sub="${esc(c.id)}">${ico('copy')}کپی ساب</button>
        <button class="btn ghost-gold sm" data-qr="${esc(c.id)}">${ico('qr')}QR</button>
        <button class="btn ghost-gold sm" data-json="${esc(c.id)}">${ico('arrdown')}JSON</button></div>
        <div class="urlrow sub" style="margin:0"><div class="u">${esc(c.sub_url)}</div></div></div>`;
    }).join('') : '<div class="panel"><div class="tbody-empty">کاربری وجود ندارد</div></div>'}`;
  $$('[data-sub]').forEach(b => b.onclick = () => {
    const c = S.clients.find(x => x.id === b.dataset.sub);
    copy(c.sub_url);
  });
  $$('[data-qr]').forEach(b => b.onclick = () => {
    const c = S.clients.find(x => x.id === b.dataset.qr);

  $$('[data-json]').forEach(b => b.onclick = () => {
    const c = S.clients.find(x => x.id === b.dataset.json);
    showJSON(c);

}

      <h3 style="margin-top:22px">اتصال</h3><p class="sub">این مقادیر روی لینک‌های ساخته‌شده اثر می‌گذارند</p>

      <div class="field"><label>قالب نام</label><input class="in ltr" name="cfg_fmt" id="cfgFmt" value="${esc(s.cfg_fmt || '{name}-{label}')}" maxlength="100">
        <small>متغیرها: <bdi>{name}</bdi> نام کاربر · <bdi>{label}</bdi> نوع کانفیگ · <bdi>{proto}</bdi> پروتکل · <bdi>{net}</bdi> ترنسپورت · <bdi>{sec}</bdi> امنیت · <bdi>{server}</bdi> آدرس اتصال · <bdi>{uuid8}</bdi> هشت نویسه UUID · <bdi>{date}</bdi> تاریخ امروز. اگر قالب نامعتبر باشد، نام به‌صورت خودکار به حالت پیش‌فرض برمی‌گردد.</small></div>
      <div class="chips" id="cfgChips"></div>

      <h3 style="margin-top:22px">پروتکل‌های فعال</h3><p class="sub">پروتکل‌های خاموش از لینک‌ها، ساب و خود Xray حذف می‌شوند (حمله‌پذیری کمتر، مصرف RAM کمتر)</p>
      <div class="toggles">${(S.protocols || []).map(p => `
        <label class="tgl ${s.protocols?.[p.key] === false ? 'off' : ''}"><input type="checkbox" name="proto" value="${p.key}" ${s.protocols?.[p.key] !== false ? 'checked' : ''}><span><b>${esc(p.name)}</b><small>${esc(p.note || '')}</small></span></label>`).join('')}
      </div>
      <div class="field" style="margin-top:14px"><label>مدت نشست ورود (ساعت)</label><input class="in num" name="session_hours" type="number" min="1" max="336" value="${esc(s.session_hours || 12)}">
        <small>بعد از این مدت، ورود پنل دوباره لازم است (۱ تا ۳۳۶ ساعت).</small></div>
      <button class="btn gold" style="width:100%">ذخیره تغییرات</button>
    </form>
    <div class="panel mt"><h3>پشتیبان‌گیری و بازیابی</h3><p class="sub">خروجی کامل کاربران، اینباندها و تنظیمات — رمز پنل هرگز در فایل پشتیبان ذخیره نمی‌شود</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn ghost-gold sm" id="backupBtn">${ico('arrdown')}دانلود پشتیبان (JSON)</button>
        <label class="btn ghost-gold sm" style="cursor:pointer">${ico('plus')}بازیابی از فایل<input type="file" id="restoreFile" accept=".json,application/json" hidden></label>
      </div>
      <small style="display:block;margin-top:8px;color:var(--mu2);font-size:11.5px">بازیابی، کاربران و اینباندها و تنظیمات فعلی را جایگزین می‌کند — قبل از انجام، از وضعیت فعلی پشتیبان بگیرید.</small>
    </div>`;
  const CFG_VARS = {
    name: (S.clients[0] && S.clients[0].name) || 'user1', label: 'VLESS-WS', proto: 'VLESS', net: 'WS', sec: 'TLS',
    server: s.address || S.host, uuid8: (S.clients[0] && S.clients[0].id.slice(0, 8)) || 'a1b2c3d4',
    date: new Date().toISOString().slice(0, 10).replace(/-/g, '')
  };
  const CFG_LABELS = ['VLESS-WS', 'VLESS-XHTTP', 'VLESS-HTTPUpgrade', 'VMess-WS', 'Trojan-WS']
    .concat((S.inbounds || []).map(i => i.name));
  $('#cfgChips').innerHTML = Object.keys(CFG_VARS).filter(k => k !== 'label').map(k => `<button type="button" class="chip" data-v="{${k}}">{${k}}</button>`).join('');
  $$('#cfgChips .chip').forEach(b => b.onclick = () => {
    const el = $('#cfgFmt'), p = el.selectionStart ?? el.value.length, q = el.selectionEnd ?? p;
    el.value = el.value.slice(0, p) + b.dataset.v + el.value.slice(q);
    el.focus(); el.selectionStart = el.selectionEnd = p + b.dataset.v.length;
    cfgPreview();
  });
  function cfgName(fmt, label) {
    const vars = { ...CFG_VARS, label };
    let bad = false;
    const out = fmt.replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : (bad = true, m));
    if (bad || !out.replace(/[\s\-_]/g, '')) return `<span class="bad">${esc(label)}: نامعتبر ← پیش‌فرض</span>`;
    return `<b>${esc(out)}</b>`;
  }
  function cfgPreview() {
    const fmt = $('#cfgFmt').value;
    $('#cfgPrev').innerHTML = CFG_LABELS.map(l => cfgName(fmt, l)).join('<br>');
  }
  $('#cfgFmt').addEventListener('input', cfgPreview);
  cfgPreview();
  $('#setForm').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const protocols = {};
    $$('input[name=proto]').forEach(cb => protocols[cb.value] = cb.checked);
    try {
      await api('settings', { user: f.user.value, pass: f.pass.value, address: f.address.value, reality_sni: f.reality_sni.value, cfg_fmt: f.cfg_fmt.value, protocols, session_hours: f.session_hours.value });
      S = await api('state'); setMe(); toast('ذخیره شد'); viewSettings();
    } catch (er) { toast(er.message, true); }
  };
  $('#backupBtn').onclick = dlBackup;
  $('#restoreFile').onchange = e => { const f = e.target.files[0]; if (f) doRestore(f); e.target.value = ''; };
}

/* ═════════ reports ═════════ */
function viewReports() {
  const cs = [...S.clients].sort((a, b) => (b.up + b.down) - (a.up + a.down));
  const top = cs.slice(0, 10);
  const mx = Math.max(1, ...top.map(c => c.up + c.down));
  // BUGFIX: this view used to rely on ST which is only filled by the dashboard's
  // live polling - opening «گزارشات» right after login showed «0 B» and an empty
  // chart forever. The view now fetches stats itself when they are missing.
  const totalDown = ST ? ST.rx_total : null, totalUp = ST ? ST.tx_total : null;
  $('#view').innerHTML = `
    <div class="grid4" style="grid-template-columns:repeat(3,1fr)">
      ${statCard('arrdown', 'green', 'کل دانلود سرور', totalDown === null ? '…' : size(totalDown), '', 'از زمان راه‌اندازی')}
      ${statCard('arrup', 'cyan', 'کل آپلود سرور', totalUp === null ? '…' : size(totalUp), '', 'از زمان راه‌اندازی')}
      ${statCard('users', 'blue', 'بیشترین مصرف', esc(top[0]?.name || '—'), '', top[0] ? size(top[0].up + top[0].down) : 'بدون کاربر')}
    </div>
    <div class="panel mt"><h3>نمودار مصرف منابع</h3><p class="sub">۳ دقیقه اخیر · بروزرسانی زنده</p>
      <div class="legend" style="margin-bottom:8px"><span><i style="background:${CHART_COLORS.cpu}"></i>CPU</span><span><i style="background:${CHART_COLORS.ram}"></i>RAM</span><span><i style="background:${CHART_COLORS.disk}"></i>Storage</span><span><i style="background:${CHART_COLORS.net}"></i>Network</span></div>
      <div class="chart-wrap"><svg id="resChart2" style="height:240px"></svg></div></div>
    <div class="panel mt"><h3>سهم مصرف کاربران</h3><p class="sub">۵ کاربر برتر + سایرین</p>
      <div class="donut-wrap" id="donutBox"></div></div>
    <div class="panel mt"><h3>مصرف به تفکیک کاربر</h3><p class="sub">مجموع ترافیک ثبت‌شده هر کاربر</p>
      ${top.length ? top.map(c => `<div style="padding:9px 0;border-top:1px solid var(--line2)">
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px"><b>${esc(c.name)}</b><span class="ltr" style="color:var(--mu);font-family:var(--mono)">${size(c.up + c.down)}</span></div>
        <div class="ubar"><b style="width:${Math.max((c.up + c.down) / mx * 100, 2)}%"></b></div></div>`).join('')
      : '<div class="tbody-empty">داده‌ای موجود نیست</div>'}</div>`;
  if (ST) {
    const d = ST, n = d.hist.cpu.length, interval = d.interval || 2;
    const net = d.hist.rx.map((v, i) => { const mx2 = Math.max(1, ...d.hist.rx, ...d.hist.tx); return Math.min(97, (v + d.hist.tx[i]) / mx2 * 90 + 4); });
    drawChart($('#resChart2'), [
      { color: CHART_COLORS.cpu, data: d.hist.cpu },
      { color: CHART_COLORS.ram, data: d.hist.mem },
      { color: CHART_COLORS.disk, data: new Array(n).fill(d.disk.percent) },
      { color: CHART_COLORS.net, data: net },
    ], timeLabels(n, interval));
  } else {
    $('#resChart2').insertAdjacentHTML('beforebegin', '<p class="sub" style="margin:10px 2px">در حال دریافت آمار زنده…</p>');
    api('stats').then(d => { ST = d; if (tab === 'reports') viewReports(); }).catch(() => {});
  }
  const DONUT_COLORS = ['#d9b44a', '#5b8cff', '#3ddc84', '#a78bfa', '#38bdf8'];
  const top5 = top.slice(0, 5);
  const othersVal = cs.slice(5).reduce((a, c) => a + c.up + c.down, 0);
  const parts = top5.map((c, i) => ({ label: c.name, value: c.up + c.down, color: DONUT_COLORS[i] }));
  if (othersVal > 0) parts.push({ label: 'سایر کاربران', value: othersVal, color: '#8a94ad' });
  $('#donutBox').innerHTML = donut(parts) + `<div class="dlegend">${parts.map(p => `
    <span><i style="background:${p.color}"></i>${esc(p.label)}<b>${size(p.value)}</b></span>`).join('') || '<span class="sub">داده‌ای موجود نیست</span>'}</div>`;
}

/* ═════════ tools ═════════ */
const NET_L = { ws: 'WebSocket', xhttp: 'XHTTP', httpupgrade: 'HTTPUpgrade', grpc: 'gRPC', tcp: 'TCP' };
function viewTools() {
  const list = S.inbounds.length
    ? S.inbounds.map(i => `<div><div class="pn"><b>${esc(i.name)}</b><small class="ltr">${esc(i.protocol.toUpperCase())} · ${esc(NET_L[i.network])} · ${esc(i.security)}${i.port ? ' · :' + i.port : ''}</small></div>
        ${i.path ? `<code>${esc(i.path)}</code>` : ''}<button class="btn bad icon sm" data-del="${esc(i.tag)}" aria-label="حذف اینباند">${ico('trash')}</button></div>`).join('')
    : '<p class="sub" style="margin:0">هنوز اینباند سفارشی نساخته‌اید.</p>';
  $('#view').innerHTML = `
    <div class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h3>سرویس Xray</h3><p class="sub">اگر کانفیگی پس از تغییرات وصل نشد، Xray را دوباره راه‌اندازی کنید.</p></div>
      <span class="status ${S.xray.running ? 'ok' : 'no'}"><i></i>${S.xray.running ? 'در حال اجرا' : 'متوقف'}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost-gold" id="rst">${ico('refresh')}راه‌اندازی مجدد Xray</button>
        <button class="btn ghost-gold" id="healthBtn">${ico('shield')}بررسی سلامت سرویس</button>
        <button class="btn ghost-gold" id="logBtn">${ico('server')}لاگ زنده Xray</button>
        <button class="btn ghost-gold" id="srvBtn">${ico('arrdown')}دانلود پیکربندی سرور</button>
      </div>
      <div id="healthOut"></div></div>
    <div class="panel mt"><h3>اینباند سفارشی</h3><p class="sub">پروتکل، ترنسپورت و امنیت را خودتان انتخاب کنید؛ لینک آن خودکار به همه کاربران و ساب اضافه می‌شود.</p>
      <div class="plist">${list}</div>
      <form class="ibf" id="ibForm">
        <div class="field"><label>نام اینباند</label><input class="in" name="name" maxlength="30" required></div>
        <div class="g2">
          <div class="field"><label>پروتکل</label><select class="in" name="protocol"><option value="vless">VLESS</option><option value="vmess">VMess</option><option value="trojan">Trojan</option></select></div>
          <div class="field"><label>امنیت</label><select class="in" name="security"><option value="tls">TLS (پشت دامنه)</option><option value="reality">Reality (پورت مستقیم)</option></select></div>
          <div class="field"><label>ترنسپورت</label><select class="in" name="network"></select></div>
          <div class="field" id="fPort"><label>پورت</label><input class="in ltr" name="port" type="number" min="1024" max="65535" placeholder="مثلاً 9443"></div>
        </div>
        <div class="field" id="fPath"><label id="lPath">مسیر (خالی = خودکار)</label><input class="in ltr" name="path" placeholder="/abc123"></div>
        <div class="field" id="fSni"><label>SNI</label><input class="in ltr" name="sni" placeholder="${esc(S.settings.reality_sni)}"></div>
        <small id="ibHint" style="color:var(--mu);font-size:12px"></small>
        <button class="btn gold" style="width:100%;margin-top:12px">ساخت اینباند</button>
      </form></div>`;
  $('#rst').onclick = async () => {
    const b = $('#rst'); b.disabled = true;
    try { await api('restart', {}); S = await api('state'); toast('Xray دوباره راه‌اندازی شد'); viewTools(); } catch (er) { toast(er.message, true); }
    b.disabled = false;
  };
  $('#logBtn').onclick = showLog;
  $('#srvBtn').onclick = dlServerConfig;
  $('#healthBtn').onclick = async () => {
    const b = $('#healthBtn'); b.disabled = true;
    $('#healthOut').innerHTML = '<p class="sub" style="margin:12px 0 0">در حال تست ارتباط با Xray…</p>';
    try {
      const h = await api('health');
      $('#healthOut').innerHTML = `<div class="healthgrid">
        <div class="hcell"><b class="ltr">${h.latency_ms} ms</b><span>تاخیر Xray API</span></div>
        <div class="hcell"><b>${h.xray ? 'فعال' : 'خاموش'}</b><span>Xray</span></div>
        <div class="hcell"><b>${h.nginx ? 'فعال' : 'خاموش'}</b><span>nginx</span></div>
        <div class="hcell"><b class="ltr">${dur(h.uptime)}</b><span>آپتایم</span></div>
        <div class="hcell"><b class="ltr">v${esc(h.version)}</b><span>نسخه پنل</span></div>
      </div>`;
      renderIssues();
    } catch (er) { $('#healthOut').innerHTML = ''; toast(er.message, true); }
    b.disabled = false;
  };
  const f = $('#ibForm');
  const sync = () => {
    const rea = f.security.value === 'reality';
    if (rea) f.protocol.value = 'vless';
    [...f.protocol.options].forEach(o => o.disabled = rea && o.value !== 'vless');
    let nets = rea ? ['tcp', 'xhttp', 'grpc'] : ['ws', 'xhttp', 'httpupgrade', 'grpc'];
    if (!rea && f.protocol.value === 'vmess') nets = nets.filter(n => n !== 'xhttp');
    const cur = f.network.value;
    f.network.innerHTML = nets.map(n => `<option value="${n}">${NET_L[n]}</option>`).join('');
    f.network.value = nets.includes(cur) ? cur : nets[0];
    const net = f.network.value;
    $('#fPort').hidden = $('#fSni').hidden = !rea;
    $('#fPath').hidden = net === 'tcp';
    $('#lPath').textContent = net === 'grpc' ? 'Service name (خالی = خودکار)' : 'مسیر (خالی = خودکار)';
    $('#ibHint').textContent = rea
      ? 'Reality روی پورت مستقیم گوش می‌دهد؛ این پورت باید از بیرون باز باشد (VPS یا پورت اضافه در docker-compose). روی Railway فقط یک TCP Proxy هست که Reality پیش‌فرض از آن استفاده می‌کند.'
      : net === 'grpc' ? 'gRPC به HTTP/2 نیاز دارد؛ پشت پروکسی HTTP ریلوی ممکن است وصل نشود و روی VPS با دامنه خودتان مطمئن‌تر است.'
      : 'TLS را دامنه یا پلتفرم انجام می‌دهد و مسیر جدا روی همان پورت ۴۴۳ سرو می‌شود.';
  };
  f.security.onchange = f.protocol.onchange = f.network.onchange = sync; sync();
  f.onsubmit = async e => {
    e.preventDefault(); const b = f.querySelector('button:last-of-type'); b.disabled = true;
    try { await api('inbounds', Object.fromEntries(new FormData(f))); S = await api('state'); toast('اینباند ساخته شد'); viewTools(); }
    catch (er) { toast(er.message, true); b.disabled = false; }
  };
  $$('[data-del]').forEach(b => b.onclick = async () => {
    if (!await ask('این اینباند حذف شود؟ لینک‌های آن از همه کاربران پاک می‌شود.')) return;
    try { await api('inbounds/delete', { tag: b.dataset.del }); S = await api('state'); toast('حذف شد'); viewTools(); }
    catch (er) { toast(er.message, true); }
  });
}
