<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0805;--gold:#e8b923;--gold2:#c9982b;--txt:#f5ecd9;--muted:#a99a76}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Vazirmatn',sans-serif;color:var(--txt);
    background:
      radial-gradient(ellipse 900px 500px at 85% -5%,rgba(232,185,35,.18),transparent 60%),
      radial-gradient(ellipse 700px 500px at 0% 100%,rgba(52,211,153,.08),transparent 60%),
      var(--bg);
    text-align:center;padding:24px;
  }
  .box{max-width:420px}
  .logo{width:96px;height:96px;margin:0 auto 20px;filter:drop-shadow(0 8px 24px rgba(232,185,35,.35))}
  h1{font-weight:900;font-size:24px;margin:0 0 8px;color:var(--gold)}
  p{color:var(--muted);font-size:14px;line-height:1.9;margin:0}
</style>
</head>
<body>
  <div class="box">
    <svg class="logo" viewBox="0 0 100 100">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#f2c14e" stroke-width="3">
          <circle cx="50" cy="32" r="12"/>
          <path d="M63 32h9M61.3 25.5 69 21M56.5 20.7 61 13M50 19V10M43.5 20.7 39 13M38.7 25.5 31 21M37 32h-9"/>
        </g>
        <g stroke="#c9982b" stroke-width="3">
          <circle cx="30" cy="58" r="8"/>
          <path d="M38 58h5M35.7 52.3l3.5-3.5M30 50v-5M24.3 52.3l-3.5-3.5M22 58h-5M24.3 63.7l-3.5 3.5M30 66v5M35.7 63.7l3.5 3.5"/>
          <path d="M38 60c12 0 24 6 28 18 2 6-2 12-10 12H34c-8 0-12-4-12-10 0-10 6-18 16-20Z"/>
          <path d="M64 74c16-6 18-28 2-38" stroke-width="3"/>
          <circle cx="66" cy="36" r="2.2" fill="#c9982b"/>
        </g>
      </g>
    </svg>
    <h1>سرویس با موفقیت اجرا شده است</h1>
    <p>این صفحه به‌عنوان صفحه پیش‌فرض نمایش داده می‌شود.<br>سرور در حال کار عادی است.</p>
  </div>
</body>
</html>
