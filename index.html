<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f1a">
<title>Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Vazirmatn',Tahoma,sans-serif;color:#e9edf7;text-align:center;padding:24px;
background:radial-gradient(900px 420px at 80% -10%,rgba(224,182,79,.09),transparent 60%),radial-gradient(700px 500px at 10% 110%,rgba(79,142,247,.06),transparent 60%),#0b0f1a}
.box{max-width:430px}
.emb{width:96px;height:96px;filter:drop-shadow(0 10px 30px rgba(217,169,47,.3))}
h1{font-weight:900;font-size:22px;margin:14px 0 6px;color:#f3d27a}
p{color:#93a0bd;font-size:14px;line-height:2;margin:0}
.uline{display:block;width:56px;height:3px;border-radius:3px;background:linear-gradient(135deg,#f3d27a,#d9a92f);margin:18px auto 0}
</style>
</head>
<body>
<div class="box">
  <svg class="emb" viewBox="0 0 120 120" aria-hidden="true">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7dc8a"/><stop offset=".55" stop-color="#dcaa3a"/><stop offset="1" stop-color="#96700f"/></linearGradient></defs>
    <g fill="url(#gg)">
      <path id="ray" d="M57.4 15 L60 5.5 L62.6 15 Z"/>
      <use href="#ray" transform="rotate(30 60 30)"/><use href="#ray" transform="rotate(60 60 30)"/><use href="#ray" transform="rotate(90 60 30)"/><use href="#ray" transform="rotate(120 60 30)"/><use href="#ray" transform="rotate(150 60 30)"/><use href="#ray" transform="rotate(180 60 30)"/><use href="#ray" transform="rotate(210 60 30)"/><use href="#ray" transform="rotate(240 60 30)"/><use href="#ray" transform="rotate(270 60 30)"/><use href="#ray" transform="rotate(300 60 30)"/><use href="#ray" transform="rotate(330 60 30)"/>
      <circle cx="60" cy="30" r="12"/>
      <circle cx="33" cy="60" r="11.5"/><circle cx="30.5" cy="58.5" r="6.8"/><circle cx="28" cy="50.8" r="3"/>
      <path d="M40 62 Q46 56.5 56 56 L72 57 Q84 58 87.5 65 L88 76 Q88 80 84 80 L42 80 Q40 80 40 77 Z"/>
      <rect x="44" y="77" width="5.6" height="19" rx="2.4"/><rect x="56" y="77" width="5.6" height="17" rx="2.4"/><rect x="72" y="77" width="5.6" height="19" rx="2.4"/>
      <path d="M87.5 66 Q96.5 62 95.5 52.5" stroke="url(#gg)" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="95.5" cy="51" r="2.5"/>
    </g>
    <circle cx="29" cy="57.5" r="1.1" fill="#0b0f1a"/>
    <path d="M26 98.5 H94" stroke="url(#gg)" stroke-width="1.6" stroke-linecap="round" opacity=".4"/>
  </svg>
  <h1>سرویس با موفقیت اجرا شده است</h1>
  <p>این صفحه به‌عنوان صفحه پیش‌فرض نمایش داده می‌شود.<br>سرور در حال کار عادی است.</p>
  <span class="uline"></span>
</div>
</body>
</html>
