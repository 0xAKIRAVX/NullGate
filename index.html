<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a12;--accent:#8b5cf6;--accent2:#c084fc;--txt:#f1f0f7;--muted:#8a8aa3}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Vazirmatn',sans-serif;color:var(--txt);
    background:
      radial-gradient(circle at 20% 0%,#1a0f2e 0%,#0a0a12 45%),
      radial-gradient(circle at 100% 100%,#0f1a2e 0%,#0a0a12 50%);
    text-align:center;padding:24px;
  }
  .box{max-width:420px}
  .logo{
    width:72px;height:72px;margin:0 auto 20px;border-radius:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:34px;
    box-shadow:0 14px 50px -10px rgba(139,92,246,.55);
  }
  h1{font-weight:900;font-size:24px;margin:0 0 8px}
  p{color:var(--muted);font-size:14px;line-height:1.9;margin:0}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">🌐</div>
    <h1>سرویس با موفقیت اجرا شده است</h1>
    <p>این صفحه به‌عنوان صفحه پیش‌فرض نمایش داده می‌شود.<br>سرور در حال کار عادی است.</p>
  </div>
</body>
</html>
