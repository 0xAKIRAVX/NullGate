services:
  nullgate:
    build: .
    container_name: nullgate
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8080}
      TCP_APP_PORT: ${TCP_APP_PORT:-9000}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
      - "${TCP_APP_PORT:-9000}:${TCP_APP_PORT:-9000}"
    volumes:
      - nullgate-data:/data

volumes:
  nullgate-data:
